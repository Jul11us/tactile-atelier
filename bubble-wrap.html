<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bubble Wrap</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Helvetica Neue",Arial,sans-serif;color:#111;cursor:none;user-select:none}
canvas{display:block}
#title{position:fixed;top:34px;left:40px;pointer-events:none}

.seg{display:flex;gap:6px;margin-bottom:18px}.seg button{flex:1;border:1px solid #ddd;background:#fff;border-radius:999px;padding:6px 0;font-size:11px;cursor:none}.seg button.on{background:#111;color:#fff;border-color:#111}

.row{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #eee;padding:9px 0}
.row b{font-family:Georgia,serif;font-style:italic;font-size:22px;font-weight:400}
.act{width:100%;margin-top:12px;background:#111;color:#fff;border:0;border-radius:999px;padding:12px;font-size:13px;letter-spacing:.04em;cursor:none}
.act:hover{background:#333}
#hint{position:fixed;left:40px;bottom:30px;font-size:12px;letter-spacing:.08em;color:#777;pointer-events:none}

#cur.hold{width:12px;height:12px;margin:-6px 0 0 -6px;background:#111}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="title"><div class="lab">Nº 25 / Calm Goods</div><h1>Bubble /<br><span>Wrap.</span></h1><p>A sheet of air, waiting to be popped. Sound on.</p></div>
<div id="panel"><h4>Plastic tint</h4><div class="sw" id="sw"></div>
<h4>Sheet size</h4><input id="size" type="range" min="6" max="14" step="1" value="10"><h4>Volume</h4><input id="vol" type="range" min="0" max="1" step="0.01" value="0.7">
<div class="row"><span>Popped</span><b id="pc">0</b></div>
<div class="row"><span>Streak</span><b id="st">×0</b></div>
<button class="act" id="fresh">Fresh sheet</button></div>
<div id="hint">Press to pop · Drag to pop a row</div>
<div id="cur"></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const cur=document.getElementById('cur');
addEventListener('pointermove',e=>{cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;});
function swatches(id,cols,cb){const el=document.getElementById(id);cols.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;if(!i)b.className='on';b.onclick=()=>{[...el.children].forEach((x,j)=>x.className=j===i?'on':'');cb(i);};el.appendChild(b);});}


const AU={c:null,m:null,v:0.7,nb:null};
function auInit(){if(AU.c)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AU.c=new C();AU.m=AU.c.createGain();AU.m.gain.value=AU.v;

addEventListener('pointerdown',auInit,{capture:true});
function noise(dur,f,q,g,type='bandpass',f2,delay=0){const c=AU.c;if(!c)return;const t=c.currentTime+delay;const s=c.createBufferSource();s.buffer=AU.nb;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;

  const ga=c.createGain();ga.gain.setValueAtTime(0.0001,t);ga.gain.exponentialRampToValueAtTime(g,t+0.004);ga.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(ga).connect(AU.m);o.start(t);o.stop(t+dur+0.03);}
document.getElementById('vol').oninput=e=>{AU.v=+e.target.value;if(AU.m)AU.m.gain.value=AU.v;};
function shadowTex(rgb='60,40,40',a=0.2){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,`rgba(${rgb},${a})`);r.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=r;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
function baseScene(){const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
  const scene=new THREE.Scene();scene.background=new THREE.Color('#fff');scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
  const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.5,80);scene.add(new THREE.HemisphereLight(0xffffff,0xeeeeee,0.8));const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(4,9,6);scene.add(dl);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});return {renderer,scene,camera};}

const TINT=['#6fb8ff','#7fe0a0','#ff8fb8','#d8dde4'];
const {renderer,scene,camera}=baseScene();renderer.setClearColor(0xffffff,1);
const root=new THREE.Group();scene.add(root);
// sheet texture: weld rings, seams, perforated edge (alpha)
function sheetTex(N){const px=64,W=(N+0.6)*px,c=document.createElement('canvas');c.width=c.height=Math.min(1024,W);const s=c.width/W,g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.strokeStyle='rgba(120,130,150,.35)';g.lineWidth=2*s;
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){g.beginPath();g.arc((i+0.8)*px*s,(j+0.8)*px*s,0.44*px*s,0,6.29);g.stroke();}

  const a=document.createElement('canvas');a.width=a.height=c.width;const ga=a.getContext('2d');ga.fillStyle='#fff';ga.fillRect(0,0,a.width,a.height);ga.fillStyle='#000';
  for(let x=6*s;x<a.width;x+=11*s){ga.fillRect(x,0,5*s,3*s);}// perforated top edge
  for(let x=4*s;x<a.width;x+=9*s){ga.beginPath();ga.arc(x,a.height-2*s,2.2*s,0,6.29);ga.fill();}
  const t1=new THREE.CanvasTexture(c),t2=new THREE.CanvasTexture(a);t1.anisotropy=4;t1.colorSpace=THREE.SRGBColorSpace;return [t1,t2];}

const bubMat=new THREE.MeshPhysicalMaterial({color:TINT[0],roughness:0.03,transmission:1,thickness:0.12,ior:1.46,attenuationColor:new THREE.Color(TINT[0]),attenuationDistance:0.6,clearcoat:1,clearcoatRoughness:0.02,iridescence:0.55,iridescenceIOR:1.3,iridescenceThicknessRange:[180,520],specularIntensity:1,envMapIntensity:1.6,sheen:0.3,sheenColor:new THREE.Color('#ffffff')});
const filmMat=new THREE.MeshPhysicalMaterial({color:TINT[0],roughness:0.32,clearcoat:1,clearcoatRoughness:0.25,transparent:true,opacity:0.7,depthWrite:false,side:THREE.DoubleSide,iridescence:0.3});
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:shadowTex('60,80,110',0.16),transparent:true,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=-0.6;shadow.renderOrder=0;scene.add(shadow);
// air-pressure dome: flat flange, steep shoulder, taut top
const prof=[];for(let k=0;k<=24;k++){const u=k/24,r=0.5*Math.cos(u*Math.PI/2)**0.55;prof.push(new THREE.Vector2(Math.max(0.001,r),0.5*Math.sin(u*Math.PI/2)**0.85));}prof.unshift(new THREE.Vector2(0.53,0));
const bubG=new THREE.LatheGeometry(prof.reverse().map(v=>v).reverse(),40);
// crinkled film variants with torn hole
function filmGeo(seed){let r=seed*99.1;const rnd=()=>(r=Math.sin(r*12.9898+78.233)*43758.5453)-Math.floor(r);const g=new THREE.RingGeometry(0.1,0.47,40,6);g.rotateX(-Math.PI/2);const p=g.attributes.position;
  const hole=[...Array(41)].map(()=>0.07+rnd()*0.14),cre=[...Array(7)].map(()=>[rnd()*6.28,0.4+rnd()*0.6]);
  for(let i=0;i<p.count;i++){let x=p.getX(i),z=p.getZ(i);const a=Math.atan2(z,x),r0=Math.hypot(x,z);const ai=Math.round(((a+Math.PI)/(2*Math.PI))*40)%41;const t=(r0-0.1)/0.37;const rr=hole[ai]+(0.47-hole[ai])*t;
    let y=0;for(const[ca,ck]of cre){const d=Math.abs(Math.sin(a-ca));y+=Math.exp(-d*d*120)*0.03*ck*Math.sin(t*3.1);}y+=(Math.sin(a*9+r0*30)*0.008+Math.sin(a*17)*0.004)*t+0.025*(1-t)*(1-t);
    p.setXYZ(i,Math.cos(a)*rr,y+0.004,Math.sin(a)*rr);}g.computeVertexNormals();return g;}
const filmGs=[0,1,2].map(k=>filmGeo(k+1));
let N=10,sheet,bubs,films,cells=[],ripples=[],popped=0,streak=0,best=0,lastPop=-9,T=0,shake=0,baseY;
function curl(x,z){const H=(N+0.6)/2;const ex=Math.max(0,Math.abs(x)-H+1.1),ez=Math.max(0,Math.abs(z)-H+1.1);return 0.09*ex*ex+0.06*ez*ez+0.05*Math.sin(x*0.6+1)*Math.cos(z*0.5);}
function build(){if(sheet){root.remove(sheet,bubs,...films);sheet.geometry.dispose();bubs.dispose();films.forEach(f=>f.dispose());}
  const W=N+0.6;const g=new THREE.PlaneGeometry(W,W,N*6,N*6).rotateX(-Math.PI/2);baseY=new Float32Array(g.attributes.position.count);
  for(let i=0;i<baseY.length;i++){baseY[i]=curl(g.attributes.position.getX(i),g.attributes.position.getZ(i));g.attributes.position.setY(i,baseY[i]);}g.computeVertexNormals();
  const [m,a]=sheetTex(N);sheetMat.map?.dispose();sheetMat.alphaMap?.dispose();sheetMat.map=m;sheetMat.alphaMap=a;sheetMat.needsUpdate=true;
  sheet=new THREE.Mesh(g,sheetMat);sheet.renderOrder=1;
  bubs=new THREE.InstancedMesh(bubG,bubMat,N*N);bubs.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  films=filmGs.map(fg=>{const f=new THREE.InstancedMesh(fg,filmMat,N*N);f.renderOrder=3;f.count=N*N;return f;});
  root.add(sheet,bubs,...films);cells=[];
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const x=i-(N-1)/2,z=j-(N-1)/2;cells.push({x,z,sq:0,held:false,popped:false,inf:1,infAt:-1,flat:0,rv:Math.random()*6.28,v:Math.floor(Math.random()*3),size:0.92+Math.random()*0.16,dud:Math.random()<0.08,recoil:0});}
  shadow.scale.set(W*1.6,W*1.6,1);popped=0;}
build();
const sheetH=(x,z)=>{let h=curl(x,z);for(const r of ripples){const a=T-r.t,d=Math.hypot(x-r.x,z-r.z);h+=r.a*Math.exp(-a*3)*Math.sin(d*3.4-a*16)*Math.exp(-d*0.35)*Math.min(1,a*25);}return h;};
// air puffs
const NP=240,pG=new THREE.BufferGeometry(),pP=new Float32Array(NP*3).fill(-99),pV=[...Array(NP)].map(()=>new THREE.Vector3()),pL=new Float32Array(NP);pG.setAttribute('position',new THREE.BufferAttribute(pP,3));
const dot=(()=>{const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');const r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,32,32);return new THREE.CanvasTexture(c);})();
const puffs=new THREE.Points(pG,new THREE.PointsMaterial({size:0.16,map:dot,transparent:true,opacity:0.85,depthWrite:false,color:'#eef6ff'}));puffs.renderOrder=40;puffs.frustumCulled=false;scene.add(puffs);let pi=0;
function puff(x,y,z){for(let k=0;k<14;k++){const j=pi++%NP;pP.set([x,y+0.15,z],j*3);const a=Math.random()*6.28;pV[j].set(Math.cos(a)*(0.8+Math.random()),0.6+Math.random()*1.4,Math.sin(a)*(0.8+Math.random()));pL[j]=0.45+Math.random()*0.25;}}
// combo label
const combo=document.createElement('div');combo.style.cssText='position:fixed;left:0;top:0;font:italic 34px Georgia,serif;color:#111;pointer-events:none;opacity:0;z-index:6;transition:none;white-space:nowrap';document.body.appendChild(combo);let comboT=0,lastXY=[0,0];
const pEl=document.getElementById('pc'),sEl=document.getElementById('st');
function pop(c){if(c.popped)return;c.popped=true;c.flat=0;c.held=false;popped++;streak=(T-lastPop<0.7)?streak+1:1;lastPop=T;best=Math.max(best,streak);
  ripples.push({x:c.x,z:c.z,t:T,a:0.06});if(ripples.length>10)ripples.shift();puff(c.x,sheetH(c.x,c.z),c.z);
  const sz=c.size,pitch=1/sz;noise(0.035,(2600+Math.random()*1800)*pitch,2.2,1.0,'bandpass');noise(0.006,7000,0.6,0.6,'highpass');noise(0.22+Math.random()*0.1,4000*pitch,0.5,0.18,'highpass',9000,0.012);tone(170*pitch+Math.random()*40,55,0.08,0.4);
  pEl.textContent=popped;sEl.textContent='×'+streak;
  if(streak>=3){combo.textContent=(streak>=10?'Unstoppable ':streak>=6?'Combo ':'')+'×'+streak;combo.style.left=Math.min(lastXY[0]+18,innerWidth-560)+'px';combo.style.top=(lastXY[1]-46)+'px';comboT=1;}
  if(streak>=6)shake=Math.min(0.12,0.02+streak*0.006);}
function dud(c){c.dud=false;c.recoil=1;tone(880,1250,0.12,0.12,'triangle');noise(0.08,1200,4,0.08);}
const ray=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),-0.2),ndc=new THREE.Vector2();let down=false,held=null;
function cellAt(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const p=new THREE.Vector3();if(!ray.ray.intersectPlane(pl,p))return null;
  const i=Math.round(p.x+(N-1)/2),j=Math.round(p.z+(N-1)/2);if(i<0||j<0||i>=N||j>=N)return null;const c=cells[j*N+i];return Math.hypot(p.x-c.x,p.z-c.z)<0.5?c:null;}
renderer.domElement.addEventListener('pointerdown',e=>{down=true;lastXY=[e.clientX,e.clientY];cur.classList.add('hold');const c=cellAt(e);if(c&&!c.popped){held=c;c.held=true;noise(0.05,700,1,0.12,'lowpass');}});
addEventListener('pointermove',e=>{lastXY=[e.clientX,e.clientY];if(!down)return;const c=cellAt(e);if(c&&c!==held&&!c.popped){if(held)held.held=false;held=c;if(c.dud)dud(c);else pop(c);}});
addEventListener('pointerup',()=>{down=false;cur.classList.remove('hold');if(held){held.held=false;if(!held.popped&&held.sq>0.55){if(held.dud)dud(held);else pop(held);}}held=null;});
swatches('sw',TINT,i=>{for(const m of[sheetMat,bubMat,filmMat])m.color.set(TINT[i]);bubMat.attenuationColor.set(TINT[i]);});
document.getElementById('size').oninput=e=>{N=+e.target.value;build();pEl.textContent=0;};
document.getElementById('fresh').onclick=()=>{cells.forEach(c=>{if(c.popped)c.infAt=T+(c.x+c.z+N)*0.045;c.dud=Math.random()<0.08;});popped=0;streak=0;pEl.textContent=0;sEl.textContent='×0';noise(1.2,1500,0.5,0.06,'bandpass',4000);};
const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),pv=new THREE.Vector3(),sv=new THREE.Vector3(),Y=new THREE.Vector3(0,1,0),hide=new THREE.Matrix4().makeScale(0,0,0),clock=new THREE.Clock();let wasRipple=false;
function loop(){const dt=Math.min(clock.getDelta(),1/30);T+=dt;
  const rip=ripples.length&&T-ripples[ripples.length-1].t<2.5;const sp=sheet.geometry.attributes.position;
  if(rip){for(let i=0;i<sp.count;i++)sp.setY(i,sheetH(sp.getX(i),sp.getZ(i)));sp.needsUpdate=true;sheet.geometry.computeVertexNormals();wasRipple=true;}
  else if(wasRipple){for(let i=0;i<sp.count;i++)sp.setY(i,baseY[i]);sp.needsUpdate=true;sheet.geometry.computeVertexNormals();ripples=[];wasRipple=false;}
  const fc=[0,0,0];
  cells.forEach((c,k)=>{
    if(c.infAt>=0&&T>=c.infAt){c.popped=false;c.inf=0;c.infAt=-1;c.sq=0;if(Math.random()<0.3)tone(500+Math.random()*300,900,0.08,0.04);}
    if(!c.popped&&c.inf<1)c.inf=Math.min(1,c.inf+dt*2.6);
    if(c.held&&!c.popped){c.sq+=dt*(1.6-c.sq*1.3)*2.6;if(c.sq>=0.8){if(c.dud){dud(c);c.held=false;}else pop(c);}}// resistance builds as it squashes

    const h=sheetH(c.x,c.z);const ii=c.inf<1?(1-Math.pow(1-c.inf,3))+Math.sin(c.inf*Math.PI)*0.18:1;

    if(!c.popped){m4.compose(pv.set(c.x,h,c.z),q.setFromAxisAngle(Y,c.rv),sv.set(s*(1+sq*0.22)*wob,s*(0.9*(1-sq*0.6)+0.0)*(2-wob),s*(1+sq*0.22)*wob));bubs.setMatrixAt(k,m4);}else bubs.setMatrixAt(k,hide);
    for(let v=0;v<3;v++){if(c.popped&&c.v===v){const f=0.6+0.4*c.flat;m4.compose(pv.set(c.x,h+0.003,c.z),q.setFromAxisAngle(Y,c.rv),sv.set(f*c.size,1,f*c.size));films[v].setMatrixAt(k,m4);}else films[v].setMatrixAt(k,hide);}});
  bubs.instanceMatrix.needsUpdate=true;films.forEach(f=>f.instanceMatrix.needsUpdate=true);
  for(let j=0;j<NP;j++){if(pL[j]<=0)continue;pL[j]-=dt;pV[j].multiplyScalar(1-dt*4);pP[j*3]+=pV[j].x*dt;pP[j*3+1]+=pV[j].y*dt;pP[j*3+2]+=pV[j].z*dt;if(pL[j]<=0)pP[j*3+1]=-99;}pG.attributes.position.needsUpdate=true;puffs.material.opacity=0.8;
