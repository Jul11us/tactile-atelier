<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Popcorn</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Helvetica Neue",Arial,sans-serif;color:#111;cursor:none;user-select:none}
canvas{display:block}
#title{position:fixed;top:34px;left:40px;pointer-events:none}
#title .lab{font-variant:small-caps;letter-spacing:.18em;font-size:13px;text-transform:lowercase;color:#555}
#title h1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:64px;line-height:.95;margin:10px 0 12px}
#title h1 span{color:#e9a21c}
#title p{margin:0;font-size:14px;color:#666}
#panel{position:fixed;right:32px;top:50%;transform:translateY(-50%);width:220px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid #eee;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:20px;font-size:12px}
#panel h4{margin:0 0 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#888;font-weight:500}
.sw{display:flex;gap:9px;margin-bottom:20px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:none;padding:0}
.sw button.on{box-shadow:0 0 0 2px #111}
.seg{display:flex;gap:6px;margin-bottom:18px}.seg button{flex:1;border:1px solid #ddd;background:#fff;border-radius:999px;padding:6px 0;font-size:11px;cursor:none}.seg button.on{background:#111;color:#fff;border-color:#111}
input[type=range]{width:100%;accent-color:#111;margin:0 0 18px;cursor:none}
.row{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #eee;padding:9px 0}
.row b{font-family:Georgia,serif;font-style:italic;font-size:22px;font-weight:400}
.act{width:100%;margin-top:12px;background:#111;color:#fff;border:0;border-radius:999px;padding:12px;font-size:13px;letter-spacing:.04em;cursor:none}
.act:hover{background:#333}
#hint{position:fixed;left:40px;bottom:30px;font-size:12px;letter-spacing:.08em;color:#777;pointer-events:none}
#cur{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1.5px solid #111;background:rgba(17,17,17,.06);pointer-events:none;transition:width .15s,height .15s,margin .15s,background .15s;z-index:9}
#cur.hold{width:12px;height:12px;margin:-6px 0 0 -6px;background:#111}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/","cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
</head><body>
<div id="title"><div class="lab">Nº 17 / Popped Goods</div><h1>Pop /<br><span>Corn.</span></h1><p>Hold to heat the pan. Wait for it.</p></div>
<div id="panel"><h4>Butter</h4><div class="sw" id="sw"></div>
<h4>Heat</h4><input id="heat" type="range" min="0.2" max="1" step="0.01" value="0.6">
<div class="row"><span>Popped</span><b id="pc">0</b></div>
<div class="row"><span>Kernels</span><b id="kc">0</b></div>
<div class="row"><span>Pan</span><b id="tc">20°</b></div>
<button class="act" id="add">Add kernels</button></div>
<div id="hint">Hold anywhere to heat · Let go and it cools back to kernels · Heat again to re-pop</div>
<div id="cur"></div>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const cur=document.getElementById('cur');
addEventListener('pointermove',e=>{cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;});
function swatches(id,cols,cb){const el=document.getElementById(id);cols.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;if(!i)b.className='on';b.onclick=()=>{[...el.children].forEach((x,j)=>x.className=j===i?'on':'');cb(i);};el.appendChild(b);});}


const BUT=['#fff8ec','#ffe28a','#d9964a','#ffb6c8','#b9dcff'];
let revT=0.4, but=0, heatMax=0.6, temp=0, heating=false, popped=0;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#fff');
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,0.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0xeee6dc,0.7));
const sun=new THREE.DirectionalLight(0xfff4e6,1.5); sun.position.set(4,12,6); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:40}); sun.shadow.radius=5; sun.shadow.bias=-0.0006; scene.add(sun);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:0.12})); fl.rotation.x=-Math.PI/2; fl.receiveShadow=true; scene.add(fl);
// physics
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-14,0)}); world.broadphase=new CANNON.SAPBroadphase(world); world.allowSleep=true; world.solver.iterations=8;
world.defaultContactMaterial.friction=0.5; world.defaultContactMaterial.restitution=0.35;
const ground=new CANNON.Body({mass:0,shape:new CANNON.Plane()}); ground.quaternion.setFromEuler(-Math.PI/2,0,0); world.addBody(ground);
// pan
const PR=2.8, PH=0.9, PY=0.6;
const panMat=new THREE.MeshPhysicalMaterial({color:'#2b2b2f',metalness:0.7,roughness:0.35,clearcoat:0.5,emissive:'#ff5a1a',emissiveIntensity:0});
const pts=[new THREE.Vector2(0,0),new THREE.Vector2(PR-0.15,0),new THREE.Vector2(PR,0.12),new THREE.Vector2(PR+0.12,PH),new THREE.Vector2(PR+0.2,PH+0.03),new THREE.Vector2(PR+0.12,PH+0.06),new THREE.Vector2(PR+0.04,PH),new THREE.Vector2(PR-0.08,0.15),new THREE.Vector2(PR-0.2,0.1),new THREE.Vector2(0,0.1)];
const pan=new THREE.Mesh(new THREE.LatheGeometry(pts,64),panMat); pan.position.y=PY; pan.castShadow=pan.receiveShadow=true; scene.add(pan);
const handle=new THREE.Mesh(new THREE.CapsuleGeometry(0.16,2.6,6,12),new THREE.MeshStandardMaterial({color:'#1b1b1d',roughness:0.6}));
handle.rotation.z=Math.PI/2; handle.position.set(-PR-1.6,PY+PH-0.1,-0.4); handle.castShadow=true; scene.add(handle);
const stand=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.9,PY,48),new THREE.MeshStandardMaterial({color:'#e9e4dc',roughness:0.8})); stand.position.y=PY/2; stand.castShadow=true; scene.add(stand);
const burner=new THREE.Mesh(new THREE.RingGeometry(0.9,1.3,48).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:'#ff6a1a',transparent:true,opacity:0,blending:THREE.AdditiveBlending}));
burner.position.y=PY+0.105; scene.add(burner);
const panBody=new CANNON.Body({mass:0}); panBody.addShape(new CANNON.Cylinder(PR,PR,0.2,32),new CANNON.Vec3(0,PY,0));
for(let i=0;i<24;i++){const a=i/24*Math.PI*2;const q=new CANNON.Quaternion().setFromEuler(0,-a,0);
  panBody.addShape(new CANNON.Box(new CANNON.Vec3(0.08,PH/2+0.1,PR*Math.PI/24*1.15)),new CANNON.Vec3(Math.cos(a)*(PR+0.05),PY+PH/2,Math.sin(a)*(PR+0.05)),q);}
world.addBody(panBody);
// popcorn geometries
function popGeo(seed){const g=new THREE.IcosahedronGeometry(1,4);const p=g.attributes.position;const lumps=[];
  for(let k=0;k<7;k++)lumps.push([new THREE.Vector3().randomDirection(),0.25+Math.random()*0.45,2+Math.random()*4]);
  const v=new THREE.Vector3(), col=[];
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).normalize();let r=0.72;for(const[d,a,e]of lumps)r+=a*Math.pow(Math.max(0,v.dot(d)),e);
    r+=0.05*Math.sin(v.x*13+seed)*Math.sin(v.y*11)*Math.sin(v.z*9);v.multiplyScalar(r);p.setXYZ(i,v.x,v.y,v.z);
    const hull=r<0.78?1:0; col.push(1-0.25*hull,1-0.4*hull,1-0.7*hull);}
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.computeVertexNormals();return g;}
const POPG=[0,1,2,3,4,5].map(popGeo);
const popMats=BUT.map(c=>new THREE.MeshPhysicalMaterial({color:c,vertexColors:true,roughness:0.75,sheen:0.6,sheenColor:new THREE.Color('#fff')}));
const kGeo=new THREE.SphereGeometry(1,14,10), kMat=new THREE.MeshPhysicalMaterial({color:'#e7a531',roughness:0.3,clearcoat:0.8});
const items=[]; const KR=0.11, PRR=0.34;
function addKernel(x,y,z){const m=new THREE.Mesh(kGeo,kMat);m.scale.set(KR*1.1,KR*0.85,KR*1.35);m.castShadow=true;scene.add(m);
  const b=new CANNON.Body({mass:0.02,shape:new CANNON.Sphere(KR),linearDamping:0.1,angularDamping:0.3});b.position.set(x,y,z);world.addBody(b);
  items.push({m,b,kernel:true,heat:0,thr:0.55+Math.random()*1.6});}
function addKernels(n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*(PR-0.5);addKernel(Math.cos(a)*r,PY+0.6+Math.random()*1.5,Math.sin(a)*r);}}
addKernels(40);
// audio
let actx=null;
function popSound(){if(!actx)return;const now=actx.currentTime;const len=0.08,buf=actx.createBuffer(1,actx.sampleRate*len,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,6);
  const src=actx.createBufferSource();src.buffer=buf;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=900+Math.random()*1600;f.Q.value=1.2;
  const g=actx.createGain();g.gain.value=0.5+Math.random()*0.4;src.connect(f).connect(g).connect(actx.destination);src.start(now);
  const o=actx.createOscillator(),og=actx.createGain();o.frequency.setValueAtTime(220,now);o.frequency.exponentialRampToValueAtTime(70,now+0.06);og.gain.setValueAtTime(0.25,now);og.gain.exponentialRampToValueAtTime(0.001,now+0.08);o.connect(og).connect(actx.destination);o.start(now);o.stop(now+0.1);}
function pip(){if(!actx)return;const now=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type='sine';
  o.frequency.setValueAtTime(1500+Math.random()*500,now);o.frequency.exponentialRampToValueAtTime(600,now+0.12);g.gain.setValueAtTime(0.0001,now);
  g.gain.linearRampToValueAtTime(0.06,now+0.03);g.gain.exponentialRampToValueAtTime(0.0001,now+0.14);o.connect(g).connect(actx.destination);o.start(now);o.stop(now+0.16);}
const KCOL=new THREE.Color('#e7a531');
function startRevert(it){it.rev=0;it.m.material=it.m.material.clone();it.c0=it.m.material.color.clone();
  const p=it.b.position;if(Math.hypot(p.x,p.z)>PR-0.3||p.y<PY-0.05||p.y>PY+3){it.tele=true;}}
function finishRevert(it){const p=it.b.position.clone();world.removeBody(it.b);scene.remove(it.m);it.m.material.dispose();
  let x=p.x,z=p.z,y=p.y;if(it.tele){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*(PR-0.6);x=Math.cos(a)*r;z=Math.sin(a)*r;y=PY+0.5+Math.random()*0.4;}
  const m=new THREE.Mesh(kGeo,kMat);m.castShadow=true;scene.add(m);
  const b=new CANNON.Body({mass:0.02,shape:new CANNON.Sphere(KR),linearDamping:0.1,angularDamping:0.3});b.position.set(x,Math.max(y,PY+0.25),z);
  b.velocity.set((Math.random()-.5)*0.4,0.8,(Math.random()-.5)*0.4);world.addBody(b);
  items[items.indexOf(it)]={m,b,kernel:true,heat:0,thr:0.55+Math.random()*1.6,grow:0};pip();}
function pop(it){
  world.removeBody(it.b);scene.remove(it.m);
  const s=0.85+Math.random()*0.4, m=new THREE.Mesh(POPG[Math.floor(Math.random()*POPG.length)],popMats[but]);m.castShadow=true;m.receiveShadow=true;scene.add(m);
  const b=new CANNON.Body({mass:0.03,shape:new CANNON.Sphere(PRR*s),linearDamping:0.25,angularDamping:0.4,sleepSpeedLimit:0.3});b.position.copy(it.b.position);b.position.y+=0.15;
  b.velocity.set((Math.random()-.5)*3,5+Math.random()*4,(Math.random()-.5)*3);b.angularVelocity.set((Math.random()-.5)*16,(Math.random()-.5)*16,(Math.random()-.5)*16);world.addBody(b);
  const np={m,b,kernel:false,s,sq:0.25,sqV:9};items[items.indexOf(it)]=np;popped++;popSound();
  if(items.filter(x=>!x.kernel).length>160){const old=items.find(x=>!x.kernel);world.removeBody(old.b);scene.remove(old.m);items.splice(items.indexOf(old),1);}}
// input
renderer.domElement.addEventListener('pointerdown',()=>{if(!actx)try{actx=new AudioContext();}catch(_){} heating=true;cur.classList.add('hold');});
addEventListener('pointerup',()=>{heating=false;cur.classList.remove('hold');});
swatches('sw',BUT,i=>{but=i;for(const it of items)if(!it.kernel)it.m.material=popMats[i];});
document.getElementById('heat').oninput=e=>heatMax=+e.target.value;
document.getElementById('add').onclick=()=>{if(!actx)try{actx=new AudioContext();}catch(_){} addKernels(30);};
const pcEl=document.getElementById('pc'),kcEl=document.getElementById('kc'),tcEl=document.getElementById('tc');
const clock=new THREE.Clock(); let T=0, frame=0;
function loop(){
  const dt=Math.min(clock.getDelta(),1/30); T+=dt;
  temp=heating?Math.min(heatMax,temp+dt*0.35*heatMax):Math.max(0,temp-dt*0.12);
  panMat.emissiveIntensity=temp*0.12; burner.material.opacity=temp*0.9;
  for(const it of [...items]){
    if(it.kernel){const p=it.b.position; if(p.y<PY+0.6&&Math.hypot(p.x,p.z)<PR){it.heat+=dt*temp*1.4;
        if(temp>0.25&&Math.random()<dt*temp*3){it.b.wakeUp();it.b.velocity.x+=(Math.random()-.5)*0.6;it.b.velocity.z+=(Math.random()-.5)*0.6;it.b.velocity.y+=Math.random()*0.8;}}
      else it.heat=Math.max(0,it.heat-dt*0.1);
      if(it.heat>it.thr)pop(it);}
  }
  if(!heating&&temp<0.12){revT-=dt;if(revT<=0){const c=items.filter(x=>!x.kernel&&x.rev===undefined);
      if(c.length){c.sort((a,b)=>(Math.hypot(b.b.position.x,b.b.position.z)>PR?1:0)-(Math.hypot(a.b.position.x,a.b.position.z)>PR?1:0));startRevert(c[Math.random()<0.5?0:Math.floor(Math.random()*c.length)]);}
      revT=Math.max(0.08,6/Math.max(8,c.length))*(0.6+Math.random()*0.8);}} else revT=0.4;
  for(const it of [...items]){if(it.kernel||it.rev===undefined)continue;it.rev+=dt/0.9;
    const k=Math.min(1,it.rev);it.m.material.color.copy(it.c0).lerp(KCOL,k);
    const r=THREE.MathUtils.lerp(PRR*it.s,KR*1.2,k*k);it.b.shapes[0].radius=r;it.b.updateBoundingRadius();it.b.wakeUp();
    if(it.tele&&k>0.5)it.fade=1-(k-0.5)*2;
    if(it.rev>=1)finishRevert(it);}
  world.step(1/60,dt,3);
  let k=0;
  for(const it of items){it.m.position.copy(it.b.position);it.m.quaternion.copy(it.b.quaternion);
    if(it.kernel){k++;if(it.grow!==undefined&&it.grow<1){it.grow=Math.min(1,it.grow+dt*3);const w=1+Math.sin(it.grow*Math.PI*3)*0.25*(1-it.grow);it.m.scale.set(KR*1.1*w*it.grow,KR*0.85/w*it.grow,KR*1.35*w*it.grow);}else it.m.scale.set(KR*1.1,KR*0.85,KR*1.35);continue;}
    it.sqV+=(-260*(it.sq-1)-9*it.sqV)*dt; it.sq+=it.sqV*dt; let s=it.s*PRR*0.85*Math.max(0.2,it.sq);
    if(it.rev!==undefined){const kk=Math.min(1,it.rev);s=THREE.MathUtils.lerp(s,KR*1.1,kk*kk)*(1+Math.sin(it.rev*Math.PI*5)*0.12*(1-kk))*(it.fade===undefined?1:Math.max(0.05,it.fade));}
    it.m.scale.set(s*(1+(1-it.sq)*0.3),s,s*(1+(1-it.sq)*0.3));}
  if(frame++%10===0){pcEl.textContent=items.length-k;kcEl.textContent=k;tcEl.textContent=Math.round(20+temp*230)+'°';}
  const a=0.25+Math.sin(T*0.07)*0.2;
  camera.position.set(Math.sin(a)*12,9.5+Math.sin(T*0.1)*0.3,Math.cos(a)*12); camera.lookAt(1.4,0.3,0);
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
window.__t={get popped(){return items.filter(x=>!x.kernel).length},get kernels(){return items.filter(x=>x.kernel).length},items,setTemp(v){temp=v;}};
loop();

</script></body></html>
