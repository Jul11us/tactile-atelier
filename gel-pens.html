<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gel Pens</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Helvetica Neue",Arial,sans-serif;color:#111;cursor:none;user-select:none}
canvas{display:block}
#title{position:fixed;top:34px;left:40px;pointer-events:none}
#title .lab{font-variant:small-caps;letter-spacing:.18em;font-size:13px;text-transform:lowercase;color:#555}
#title h1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:64px;line-height:.95;margin:10px 0 12px}
#title h1 span{color:#ff3d9a}
#title p{margin:0;font-size:14px;color:#666}
#panel{position:fixed;right:32px;top:50%;transform:translateY(-50%);width:220px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid #eee;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:20px;font-size:12px}
#panel h4{margin:0 0 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#888;font-weight:500}
.sw{display:flex;gap:9px;margin-bottom:20px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:none;padding:0}
.sw button.on{box-shadow:0 0 0 2px #111}
.seg{display:flex;gap:6px;margin-bottom:18px}.seg button{flex:1;border:1px solid #ddd;background:#fff;border-radius:999px;padding:6px 0;font-size:11px;cursor:none}.seg button.on{background:#111;color:#fff;border-color:#111}
input[type=range]{width:100%;accent-color:#111;margin:0 0 18px;cursor:none}
.row{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #eee;padding:9px 0}
.row b{font-family:Georgia,serif;font-style:italic;font-size:22px;font-weight:400}
.act{width:100%;margin-top:12px;background:#111;color:#fff;border:0;border-radius:999px;padding:12px;font-size:13px;letter-spacing:.04em;cursor:none}
.act:hover{background:#333}
#hint{position:fixed;left:40px;bottom:30px;font-size:12px;letter-spacing:.08em;color:#777;pointer-events:none}
#cur{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1.5px solid #111;background:rgba(17,17,17,.06);pointer-events:none;transition:width .15s,height .15s,margin .15s,background .15s;z-index:9}
#cur.hold{width:12px;height:12px;margin:-6px 0 0 -6px;background:#111}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="title"><div class="lab">Nº 16 / Glowing Goods</div><h1>Gel /<br><span>Pens.</span></h1><p>Thick glowing ink that shimmers and slowly runs.</p></div>
<div id="panel"><h4>Ink</h4><div class="sw" id="sw"></div>
<h4>Flow</h4><input id="flow" type="range" min="0" max="1" step="0.01" value="0.4">
<div class="row"><span>Strokes</span><b id="sk">0</b></div>
<div class="row"><span>Drips</span><b id="dp">0</b></div>
<button class="act" id="wipe">Wipe clean</button></div>
<div id="hint">Drag to draw · Ink runs with Flow · Wipe to start over</div>
<div id="cur"></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const cur=document.getElementById('cur');
addEventListener('pointermove',e=>{cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;});
function swatches(id,cols,cb){const el=document.getElementById(id);cols.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;if(!i)b.className='on';b.onclick=()=>{[...el.children].forEach((x,j)=>x.className=j===i?'on':'');cb(i);};el.appendChild(b);});}


const INK=['#ff3d9a','#a6ff3d','#2fe6ff','#ff8a1e','#a55bff'];
let ink=0, flow=0.4, strokesN=0, dripsN=0;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#fff');
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0xdddddd,0.5));
const sun=new THREE.DirectionalLight(0xffffff,1.2); sun.position.set(-4,10,6); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:30}); sun.shadow.radius=6; scene.add(sun);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:0.12})); fl.rotation.x=-Math.PI/2; fl.position.y=-0.3; fl.receiveShadow=true; scene.add(fl);
// slate board
const BW=10, BD=6.6;
const board=new THREE.Mesh(new RoundedBoxGeometry(BW,0.3,BD,4,0.14),new THREE.MeshPhysicalMaterial({color:'#17181d',roughness:0.35,clearcoat:0.6,clearcoatRoughness:0.3}));
board.position.y=-0.15; board.castShadow=true; board.receiveShadow=true; scene.add(board);
const Y=0.0;
// glow sprite texture
const gc=document.createElement('canvas');gc.width=gc.height=64;const gx=gc.getContext('2d');const gg=gx.createRadialGradient(32,32,0,32,32,32);
gg.addColorStop(0,'rgba(255,255,255,1)');gg.addColorStop(1,'rgba(255,255,255,0)');gx.fillStyle=gg;gx.fillRect(0,0,64,64);const glowTex=new THREE.CanvasTexture(gc);
const uTime={value:0};
function inkMat(col){const c=new THREE.Color(col);
  const m=new THREE.MeshPhysicalMaterial({color:c,emissive:c,emissiveIntensity:0.9,roughness:0.12,clearcoat:1,clearcoatRoughness:0.05,transparent:true});
  m.onBeforeCompile=s=>{s.uniforms.uTime=uTime;s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec2 vU;').replace('#include <uv_vertex>','#include <uv_vertex>\nvU=uv;');
    s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nuniform float uTime;varying vec2 vU;')
     .replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
       float sh=0.75+0.25*sin(vU.x*140.0-uTime*3.0)+0.35*pow(max(0.0,sin(vU.x*37.0+vU.y*6.28+uTime*1.7)),12.0);
       totalEmissiveRadiance*=sh;`);};
  m.customProgramCacheKey=()=>'gel';return m;}
const strokes=[];
function tubeFor(pts,r,seg){const curve=new THREE.CatmullRomCurve3(pts);return new THREE.TubeGeometry(curve,Math.max(4,Math.min(seg,pts.length*3)),r,10,false);}
function newStroke(p){const col=INK[ink];const s={pts:[p.clone()],col,mat:inkMat(col),mesh:null,glow:null,glowMat:new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.22,blending:THREE.AdditiveBlending,depthWrite:false}),
  caps:[],drips:[],r:0.075,swell:0,fade:1};
  const capG=new THREE.SphereGeometry(1,16,12);
  for(let i=0;i<2;i++){const c=new THREE.Mesh(capG,s.mat);c.scale.setScalar(s.r);c.castShadow=true;scene.add(c);s.caps.push(c);}
  strokes.push(s);return s;}
function rebuild(s){if(s.pts.length<2)return;
  if(s.mesh){s.mesh.geometry.dispose();s.glow.geometry.dispose();}else{s.mesh=new THREE.Mesh(undefined,s.mat);s.mesh.castShadow=true;scene.add(s.mesh);s.glow=new THREE.Mesh(undefined,s.glowMat);scene.add(s.glow);}
  const r=s.r*(1+s.swell);s.mesh.geometry=tubeFor(s.pts,r,400);s.glow.geometry=tubeFor(s.pts,r*2.6,200);
  s.caps[0].position.copy(s.pts[0]);s.caps[1].position.copy(s.pts[s.pts.length-1]);s.caps.forEach(c=>c.scale.setScalar(r));}
// drips: run toward +z (board gently tilted toward you)
const dripGeo=new THREE.CylinderGeometry(1,1,1,10,1,true).rotateX(Math.PI/2).translate(0,0,0.5), beadGeo=new THREE.SphereGeometry(1,14,10);
function addDrip(s){const p=s.pts[Math.floor(Math.random()*s.pts.length)].clone();
  const m=new THREE.Mesh(dripGeo,s.mat),b=new THREE.Mesh(beadGeo,s.mat);m.position.copy(p);b.position.copy(p);scene.add(m,b);
  s.drips.push({m,b,len:0,v:0.25+Math.random()*0.3,r:s.r*(0.45+Math.random()*0.3),p});dripsN++;}
// input
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let cur_s=null;
function setMouse(e){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);}
function hit(){ray.setFromCamera(mouse,camera);const p=new THREE.Vector3();if(!ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-(Y+0.07)),p))return null;
  return Math.abs(p.x)<BW/2-0.2&&Math.abs(p.z)<BD/2-0.2?p:null;}
addEventListener('pointermove',e=>setMouse(e));
renderer.domElement.addEventListener('pointerdown',e=>{setMouse(e);const p=hit();if(!p)return;cur_s=newStroke(p);cur.classList.add('hold');});
addEventListener('pointerup',()=>{if(cur_s){if(cur_s.pts.length>2){strokesN++;}else{removeStroke(cur_s);}}cur_s=null;cur.classList.remove('hold');});
function removeStroke(s){if(s.mesh){scene.remove(s.mesh,s.glow);s.mesh.geometry.dispose();s.glow.geometry.dispose();}s.caps.forEach(c=>scene.remove(c));s.drips.forEach(d=>scene.remove(d.m,d.b));strokes.splice(strokes.indexOf(s),1);}
let wiping=0;
swatches('sw',INK,i=>ink=i);
document.getElementById('flow').oninput=e=>flow=+e.target.value;
document.getElementById('wipe').onclick=()=>{wiping=1;};
const skEl=document.getElementById('sk'), dpEl=document.getElementById('dp');
const clock=new THREE.Clock(); let T=0, frame=0;
function loop(){
  const dt=Math.min(clock.getDelta(),1/30); T+=dt; uTime.value=T;
  if(cur_s){const p=hit();if(p){const l=cur_s.pts[cur_s.pts.length-1];if(p.distanceTo(l)>0.07){cur_s.pts.push(p);if(cur_s.pts.length>600)cur_s.pts.shift();rebuild(cur_s);}}}
  for(const s of strokes){
    if(s!==cur_s&&s.pts.length>2){
      if(s.swell<0.35*flow){s.swell+=dt*0.04*flow; if(frame%20===0)rebuild(s);}
      if(Math.random()<dt*flow*0.25*Math.min(3,s.pts.length/30)&&s.drips.length<8)addDrip(s);}
    for(const d of s.drips){d.v*=Math.exp(-dt*(0.5-flow*0.35));const ml=BD/2-0.25-d.p.z;d.len=Math.min(ml,d.len+d.v*dt*(0.3+flow));
      d.m.scale.set(d.r,d.r,Math.max(0.001,d.len));d.b.position.set(d.p.x,d.p.y,d.p.z+d.len);d.b.scale.setScalar(d.r*(1.25+0.1*Math.sin(T*3+d.p.x)));}
  }
  if(wiping>0){wiping-=dt*1.4;const o=Math.max(0,wiping);for(const s of strokes){s.mat.opacity=o;s.glowMat.opacity=0.22*o;}
    if(wiping<=0){[...strokes].forEach(removeStroke);}}
  if(frame++%10===0){skEl.textContent=strokesN;dpEl.textContent=dripsN;}
  const a=Math.sin(T*0.07)*0.2;
  camera.position.set(Math.sin(a)*13.5,12+Math.sin(T*0.1)*0.3,Math.cos(a)*13.5); camera.lookAt(1.9,-0.3,-1.3);
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
// starter doodle
(function(){const s=newStroke(new THREE.Vector3(-3.5,Y+0.07,0));for(let i=0;i<=80;i++){const t=i/80;s.pts.push(new THREE.Vector3(-3.5+t*7,Y+0.07,Math.sin(t*Math.PI*3)*1.1-0.6));}rebuild(s);strokesN=1;
  ink=2;const s2=newStroke(new THREE.Vector3(0,Y+0.07,1.6));for(let i=0;i<=60;i++){const a=i/60*Math.PI*2;s2.pts.push(new THREE.Vector3(-1.8+Math.cos(a)*0.9,Y+0.07,1.3+Math.sin(a)*0.9));}rebuild(s2);strokesN=2;ink=0;})();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
window.__t={camera,strokes,get strokesN(){return strokesN}};
loop();

</script></body></html>
