<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Squishy Slime</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Helvetica Neue",Arial,sans-serif;color:#111;cursor:none;user-select:none}
canvas{display:block}

</head><body>
<div id="title"><div class="lab">Nº 27 / Calm Goods</div><h1>Squishy /<br><span>Slime.</span></h1><p>Stretch it, poke it, fold it. Sound on.</p></div>
<div id="panel"><h4>Slime colour</h4><div class="sw" id="sw"></div>
<h4>Glitter</h4><div class="seg" id="gl"><button data-g="0" class="on">Off</button><button data-g="1">On</button></div>
<h4>Stretchiness</h4><input id="str" type="range" min="0" max="1" step="0.01" value="0.6"><h4>Volume</h4><input id="vol" type="range" min="0" max="1" step="0.01" value="0.7">
<div class="row"><span>Pokes</span><b id="pk">0</b></div>
<button class="act" id="fold">Fold it</button></div>
<div id="hint">Grab and pull to stretch · Click to poke</div>
<div id="cur"></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';
const cur=document.getElementById('cur');
addEventListener('pointermove',e=>{cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;});
function swatches(id,cols,cb){const el=document.getElementById(id);cols.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;if(!i)b.className='on';b.onclick=()=>{[...el.children].forEach((x,j)=>x.className=j===i?'on':'');cb(i);};el.appendChild(b);});}


const AU={c:null,m:null,v:0.7,nb:null};

addEventListener('pointerdown',auInit,{capture:true});
function noise(dur,f,q,g,type='bandpass',f2,delay=0){const c=AU.c;if(!c)return;const t=c.currentTime+delay;const s=c.createBufferSource();s.buffer=AU.nb;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;

document.getElementById('vol').oninput=e=>{AU.v=+e.target.value;if(AU.m)AU.m.gain.value=AU.v;};
function shadowTex(rgb='60,40,40',a=0.2){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,`rgba(${rgb},${a})`);r.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=r;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
function baseScene(){const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
  const scene=new THREE.Scene();scene.background=new THREE.Color('#fff');scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
  const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.5,80);scene.add(new THREE.HemisphereLight(0xffffff,0xeeeeee,0.8));const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(4,9,6);scene.add(dl);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});return {renderer,scene,camera};}

const COLS=['#2fd39a','#ff6fa8','#8a6cff','#ffb020'];
const {renderer,scene,camera}=baseScene();renderer.setClearColor(0xffffff,1);
const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(-3,6,4);scene.add(key);const rim=new THREE.DirectionalLight(0xffffff,0.9);rim.position.set(4,3,-5);scene.add(rim);
let g=new THREE.IcosahedronGeometry(1.7,5);g.deleteAttribute('normal');g.deleteAttribute('uv');g=mergeVertices(g);

const nb=[...Array(NV)].map(()=>new Set());const ix=g.index.array;for(let t=0;t<ix.length;t+=3){const a=ix[t],b=ix[t+1],c=ix[t+2];nb[a].add(b).add(c);nb[b].add(a).add(c);nb[c].add(a).add(b);}
const NB=nb.map(s=>[...s]);
const mat=new THREE.MeshPhysicalMaterial({color:COLS[0],roughness:0.05,transmission:0.92,thickness:0.7,ior:1.28,attenuationColor:new THREE.Color(COLS[0]),attenuationDistance:4.5,clearcoat:1,clearcoatRoughness:0.02,specularIntensity:1,sheen:0.25,sheenColor:new THREE.Color('#ffffff'),iridescence:0.12,envMapIntensity:1.6});

const shadow=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:shadowTex('30,90,70',0.25),transparent:true,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=0.0;shadow.scale.set(6.5,5,1);shadow.renderOrder=0;scene.add(shadow);
const tint=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:shadowTex('47,211,154',0.18),transparent:true,depthWrite:false}));tint.rotation.x=-Math.PI/2;tint.position.y=0.002;tint.scale.set(4.6,3.6,1);tint.renderOrder=1;scene.add(tint);
// anchors: interior points that ride the deformation (4 nearest surface verts)
const pos=(i,o)=>o.set(rest[i*3]+D[i*3],rest[i*3+1]+D[i*3+1],rest[i*3+2]+D[i*3+2]);
function anchor(p){const best=[[1e9,0],[1e9,0],[1e9,0],[1e9,0]];for(let i=0;i<NV;i++){const dx=rest[i*3]-p.x,dy=rest[i*3+1]-p.y,dz=rest[i*3+2]-p.z,d=dx*dx+dy*dy+dz*dz;if(d<best[3][0]){best[3]=[d,i];best.sort((a,b)=>a[0]-b[0]);}}
  const w=best.map(b=>1/(Math.sqrt(b[0])+0.05)),s=w.reduce((a,b)=>a+b);return {p:p.clone(),v:best.map(b=>b[1]),w:w.map(x=>x/s)};}
const av=new THREE.Vector3();function follow(a,o){o.copy(a.p);for(let k=0;k<4;k++){const i=a.v[k];o.x+=D[i*3]*a.w[k]*0.85;o.y+=D[i*3+1]*a.w[k]*0.85;o.z+=D[i*3+2]*a.w[k]*0.85;}return o;}
const inside=()=>{for(;;){const p=new THREE.Vector3((Math.random()-.5)*3.4,0.2+Math.random()*1.05,(Math.random()-.5)*3.0);if((p.x/1.75)**2+((p.y-0.78)/0.8)**2+(p.z/1.6)**2<0.8)return p;}};
const bubG=new THREE.SphereGeometry(1,20,14),bubM=new THREE.MeshPhysicalMaterial({color:'#ffffff',roughness:0.02,clearcoat:1,emissive:'#ffffff',emissiveIntensity:0.25,envMapIntensity:2});
const NBUB=8,bubs=new THREE.InstancedMesh(bubG,bubM,NBUB);scene.add(bubs);const bub=[...Array(NBUB)].map(()=>({a:null,r:0,life:0,delay:Math.random()*4,rise:0}));
const NG=320,gl=new THREE.InstancedMesh(new THREE.PlaneGeometry(0.07,0.07),new THREE.MeshStandardMaterial({color:'#fff4c0',emissive:'#ffd76a',emissiveIntensity:0.7,metalness:0.6,roughness:0.2,side:THREE.DoubleSide}),NG);gl.visible=false;scene.add(gl);
const glit=[...Array(NG)].map(()=>({a:anchor(inside()),q:new THREE.Quaternion().random(),s:Math.random()*6}));
// strand: round tube with tapered radius and sag
const TS=48,RS=14;let strand=null;const strandMat=mat;
function buildStrand(a,b,r0,sag){const mid=a.clone().lerp(b,0.5);mid.y-=sag;const q1=a.clone().lerp(mid,0.5),q3=mid.clone().lerp(b,0.5);q1.y-=sag*0.3;q3.y-=sag*0.3;
  const path=new THREE.CatmullRomCurve3([a,q1,mid,q3,b]);const geo=new THREE.TubeGeometry(path,TS,1,RS,false);const p=geo.attributes.position,c=new THREE.Vector3();
  for(let i=0;i<=TS;i++){const t=i/TS;path.getPointAt(t,c);const prof=r0*(1-0.72*Math.sin(Math.PI*t)**0.8)*(t<0.12?1+(0.12-t)*7:1)*(t>0.9?1+(t-0.9)*5:1);

  geo.computeVertexNormals();return {geo,path};}
const endBall=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),mat);endBall.visible=false;scene.add(endBall);
let tube=new THREE.Mesh(new THREE.BufferGeometry(),strandMat);tube.visible=false;scene.add(tube);
// stringy drips
const drips=[];const thrG=new THREE.CylinderGeometry(1,1,1,10,1,true).translate(0,-0.5,0),dropG=new THREE.SphereGeometry(1,16,12);
function addDrip(p){if(drips.length>5)return;const t=new THREE.Mesh(thrG,mat),d=new THREE.Mesh(dropG,mat);scene.add(t,d);drips.push({o:p.clone(),len:0.02,t,d,fall:false,v:0,y:0});}
// state
let stretch=0.6,grab=null,pokes=0,T=0,fold=-1,retract=null;
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),tmp=new THREE.Vector3(),tmp2=new THREE.Vector3();
function hit(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);return ray.intersectObject(blob)[0];}
function nearest(p){let b=0,bd=1e9;for(let i=0;i<NV;i++){const d=pos(i,tmp).distanceToSquared(p);if(d<bd){bd=d;b=i;}}return b;}
function squelch(g=0.5){noise(0.32,1500,1.1,g*0.5,'lowpass',160);tone(240+Math.random()*80,52,0.24,g*0.35);for(let k=0;k<3;k++)noise(0.012,1800+Math.random()*1800,3,g*0.25,'bandpass',null,0.03+k*0.045+Math.random()*0.02);noise(0.4,500,2,g*0.12,'bandpass',220,0.05);}
renderer.domElement.addEventListener('pointerdown',e=>{cur.classList.add('hold');const h=hit(e);if(!h)return;const v=nearest(h.point);
  const plane=new THREE.Plane().setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()).negate(),h.point);
  const w=new Float32Array(NV);const r0=new THREE.Vector3(rest[v*3],rest[v*3+1],rest[v*3+2]);for(let i=0;i<NV;i++){tmp.set(rest[i*3],rest[i*3+1],rest[i*3+2]);w[i]=tmp.distanceToSquared(r0);}

addEventListener('pointermove',e=>{if(!grab)return;if(Math.hypot(e.clientX-grab.sx,e.clientY-grab.sy)>6)grab.moved=true;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);ray.ray.intersectPlane(grab.plane,grab.target);});

  if(!grab.moved){for(let i=0;i<NV;i++){const f=Math.exp(-grab.w[i]/0.18);if(f<0.01)continue;tmp.set(rest[i*3],rest[i*3+1]-0.78,rest[i*3+2]).normalize();D[i*3]-=tmp.x*0.45*f;D[i*3+1]-=tmp.y*0.45*f;D[i*3+2]-=tmp.z*0.45*f;}
    pokes++;document.getElementById('pk').textContent=pokes;squelch(0.45);}
  else{if(grab.L>0.25)retract={v:grab.v,end:grab.target.clone(),t:0,dur:snapped?0.28:0.7,r0:strandR(grab.L),snapped};
    if(snapped){noise(0.05,2800,2,0.4);tone(320,90,0.12,0.25);noise(0.2,900,1,0.15,'lowpass',200,0.05);}else{squelch(0.3);}}
  grab=null;}
addEventListener('pointerup',()=>{cur.classList.remove('hold');release(false);});
const strandR=L=>0.42/(1+L*0.45);
swatches('sw',COLS,i=>{mat.color.set(COLS[i]);mat.attenuationColor.set(COLS[i]);const c=new THREE.Color(COLS[i]);tint.material.map.dispose();tint.material.map=shadowTex(`${c.r*255|0},${c.g*255|0},${c.b*255|0}`,0.18);tint.material.needsUpdate=true;});
document.querySelectorAll('#gl button').forEach(b=>b.onclick=()=>{gl.visible=b.dataset.g==='1';document.querySelectorAll('#gl button').forEach(x=>x.classList.toggle('on',x===b));});
document.getElementById('str').oninput=e=>stretch=+e.target.value;
document.getElementById('fold').onclick=()=>{fold=0;squelch(0.6);};
const clock=new THREE.Clock(),m4=new THREE.Matrix4(),q=new THREE.Quaternion(),pv=new THREE.Vector3(),sv=new THREE.Vector3(),Yax=new THREE.Vector3(0,1,0);
const L0=new Float32Array(NV*3);let creakT=0;
function step(dt){const k=7,c=3.2,cpl=26;let gw=null,sig=0;
  if(grab&&grab.moved){const pull=tmp2.copy(grab.target).sub(grab.start);grab.L=pull.length();const maxL=1.5+stretch*4.5;
    if(grab.L>maxL){release(true);}else{sig=0.5**2;gw=grab.w;const neck=Math.min(grab.L,0.55)/Math.max(grab.L,1e-6);

  for(let i=0;i<NV;i++){const n=NB[i];let ax=0,ay=0,az=0;for(const j of n){ax+=D[j*3];ay+=D[j*3+1];az+=D[j*3+2];}const m=n.length;L0[i*3]=ax/m-D[i*3];L0[i*3+1]=ay/m-D[i*3+1];L0[i*3+2]=az/m-D[i*3+2];}
  for(let i=0;i<NV;i++){const gf=gw?Math.exp(-gw[i]/sig):0;for(let a=0;a<3;a++){const j=i*3+a;const f=-k*D[j]+cpl*L0[j]*(1-gf)-c*V[j]*2;V[j]+=f*dt;D[j]+=V[j]*dt*(1-gf);}

  if(fold>=0){fold+=dt;const a=Math.min(1,fold/0.9);const th=Math.PI*0.9*Math.sin(a*Math.PI*0.5);
    if(fold<0.9){for(let i=0;i<NV;i++){const x=rest[i*3],y=rest[i*3+1];if(x<0.1)continue;const px=0.1,py=1.4,rx=x-px,ry=y-py;const nx=px+rx*Math.cos(th)+ry*Math.sin(th),ny=py+rx*Math.sin(th)+ry*Math.cos(th);

  let sa=null,sb=null,sr=0,sag=0;

    creakT-=dt;if(creakT<0&&AU.c){creakT=0.08;noise(0.09,260+grab.L*240,4,0.025+0.015*grab.L,'bandpass');}}
  else if(retract){retract.t+=dt;const u=Math.min(1,retract.t/retract.dur),e=retract.snapped?1-Math.pow(1-u,3):u*u;sa=pos(retract.v,new THREE.Vector3());sb=retract.end.clone().lerp(sa,e);sr=retract.r0*(1-0.5*e);sag=0.15*sb.distanceTo(sa)*(retract.snapped?0.2:1);
    if(u>=1){for(const j of[retract.v,...NB[retract.v]]){V[j*3+1]-=0.6;}retract=null;sa=null;}}
