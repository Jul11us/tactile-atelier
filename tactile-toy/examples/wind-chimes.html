<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass Chimes</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Helvetica Neue",Arial,sans-serif;color:#111;cursor:none;user-select:none}
canvas{display:block}
#title{position:fixed;top:34px;left:40px;pointer-events:none}
#title .lab{font-variant:small-caps;letter-spacing:.18em;font-size:13px;text-transform:lowercase;color:#555}
#title h1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:64px;line-height:.95;margin:10px 0 12px}
#title h1 span{color:#3fb5c4}
#title p{margin:0;font-size:14px;color:#666}
#panel{position:fixed;right:32px;top:50%;transform:translateY(-50%);width:220px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid #eee;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:20px;font-size:12px}
#panel h4{margin:0 0 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#888;font-weight:500}
.sw{display:flex;gap:9px;margin-bottom:20px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:none;padding:0}
.sw button.on{box-shadow:0 0 0 2px #111}
.seg{display:flex;gap:6px;margin-bottom:18px}.seg button{flex:1;border:1px solid #ddd;background:#fff;border-radius:999px;padding:6px 0;font-size:11px;cursor:none}.seg button.on{background:#111;color:#fff;border-color:#111}
input[type=range]{width:100%;accent-color:#111;margin:0 0 18px;cursor:none}
.row{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #eee;padding:9px 0}
.row b{font-family:Georgia,serif;font-style:italic;font-size:22px;font-weight:400}
.act{width:100%;margin-top:12px;background:#111;color:#fff;border:0;border-radius:999px;padding:12px;font-size:13px;letter-spacing:.04em;cursor:none}
.act:hover{background:#333}
#hint{position:fixed;left:40px;bottom:30px;font-size:12px;letter-spacing:.08em;color:#777;pointer-events:none}
#cur{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1.5px solid #111;background:rgba(17,17,17,.06);pointer-events:none;transition:width .15s,height .15s,margin .15s,background .15s;z-index:9}
#cur.hold{width:12px;height:12px;margin:-6px 0 0 -6px;background:#111}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="title"><div class="lab">Nº 14 / Ringing Goods</div><h1>Glass /<br><span>Chimes.</span></h1><p>Seven tuned glass tubes. Brush through them, or let the wind.</p></div>
<div id="panel"><h4>Glass tint</h4><div class="sw" id="sw"></div>
<h4>Wind</h4><input id="wind" type="range" min="0" max="1" step="0.01" value="0.3">
<div class="row"><span>Chimes struck</span><b id="sc">0</b></div>
<div class="row"><span>Tubes</span><b>7</b></div>
<button class="act" id="gust">Gust</button></div>
<div id="hint">Swipe through to strike · Click once for sound · Gust to let the wind play</div>
<div id="cur"></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const cur=document.getElementById('cur');
addEventListener('pointermove',e=>{cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;});
function swatches(id,cols,cb){const el=document.getElementById(id);cols.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;if(!i)b.className='on';b.onclick=()=>{[...el.children].forEach((x,j)=>x.className=j===i?'on':'');cb(i);};el.appendChild(b);});}


const TINT=['#dfeeff','#8fe0dc','#ffc77a','#ffadc4','#bba8ff'];
let wind=0.3, gust=0, struck=0;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#fff');
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0xeeeeee,0.6));
const sun=new THREE.DirectionalLight(0xffffff,1.4); sun.position.set(4,12,5); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:1,far:30}); sun.shadow.radius=6; scene.add(sun);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:0.1})); fl.rotation.x=-Math.PI/2; fl.receiveShadow=true; scene.add(fl);
// top
const TOPY=8.2;
const wood=new THREE.MeshStandardMaterial({color:'#d9c2a0',roughness:0.7});
const metal=new THREE.MeshStandardMaterial({color:'#bbb',metalness:1,roughness:0.25});
const top=new THREE.Mesh(new THREE.CylinderGeometry(1.45,1.45,0.14,48),wood); top.position.y=TOPY+0.07; top.castShadow=true; scene.add(top);
const hook=new THREE.Mesh(new THREE.TorusGeometry(0.16,0.03,10,24),metal); hook.position.y=TOPY+0.9; scene.add(hook);
const strLines=[];
// tubes
const NOTES=[587.3,659.3,740,880,987.8,1174.7,1318.5], N=NOTES.length, RING=1.08, LS=0.55, TR=0.12;
const tubeMat=new THREE.MeshPhysicalMaterial({color:new THREE.Color(TINT[0]).lerp(new THREE.Color('#fff'),0.55),roughness:0.04,metalness:0,transmission:1,thickness:0.35,ior:1.5,attenuationColor:new THREE.Color(TINT[0]),attenuationDistance:1.6,clearcoat:1,clearcoatRoughness:0.03,envMapIntensity:1.6,specularIntensity:1});
const bodies=[];
function mkBody(pv,L,mesh,extra){const b={pv,L,mesh,phi:new THREE.Vector2(),dphi:new THREE.Vector2(),lev:LS+L/2,cool:0,flash:0,...extra};bodies.push(b);return b;}
const tubes=NOTES.map((f,i)=>{const a=i/N*Math.PI*2+0.2, L=2.7*Math.sqrt(NOTES[0]/f);
  const mat=tubeMat.clone(); const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(TR,TR,L,40,1,false),mat); m.position.y=-LS-L/2; m.castShadow=true; g.add(m);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(TR*1.05,TR*1.05,0.06,24),metal); cap.position.y=-LS-0.03; g.add(cap);
  scene.add(g); const pv=new THREE.Vector3(Math.cos(a)*RING,TOPY,Math.sin(a)*RING);
  return mkBody(pv,L,g,{f,mat,r:TR,tube:m,pan:Math.cos(a)*0.6});});
// striker + sail
const SL=2.4, sg=new THREE.Group();
const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.08,32),wood); disc.position.y=-SL; disc.castShadow=true; sg.add(disc);
const sail=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.1,0.03),wood); sail.position.y=-SL-1.4; sail.castShadow=true; sg.add(sail);
scene.add(sg);
const striker=mkBody(new THREE.Vector3(0,TOPY,0),0,sg,{r:0.42,striker:true,lev:SL});
striker.lev=SL;
const strGeo=new THREE.BufferGeometry(); const strPos=new Float32Array(bodies.length*2*3+6); strGeo.setAttribute('position',new THREE.BufferAttribute(strPos,3));
scene.add(new THREE.LineSegments(strGeo,new THREE.LineBasicMaterial({color:'#555',transparent:true,opacity:0.7})));
// pendulum helpers
function dirOf(b){return new THREE.Vector3(b.phi.x,-1,b.phi.y).normalize();}
function pointAt(b,depth){return b.pv.clone().addScaledVector(dirOf(b),depth);}
// audio
let actx=null, master, verb;
function initAudio(){if(actx)return;actx=new AudioContext();master=actx.createDynamicsCompressor();master.connect(actx.destination);
  verb=actx.createConvolver();const len=actx.sampleRate*2.5,buf=actx.createBuffer(2,len,actx.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  verb.buffer=buf;const vg=actx.createGain();vg.gain.value=0.35;verb.connect(vg).connect(master);}
function chime(b,amp){struck++;b.flash=1;if(!actx)return;const now=actx.currentTime;amp=Math.min(0.35,amp);
  const pan=actx.createStereoPanner();pan.pan.value=b.pan;pan.connect(master);pan.connect(verb);
  [[1,1,4.5],[2.76,0.45,2.2],[5.4,0.22,1.1],[8.93,0.1,0.6]].forEach(([r,a,d])=>{const o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=b.f*r*(1+(Math.random()-.5)*0.002);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(amp*a,now+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,now+d);o.connect(g).connect(pan);o.start(now);o.stop(now+d+0.05);});}
// input
const mouse=new THREE.Vector2(), last=new THREE.Vector2(); let haveLast=false, downAny=false;
function toScreen(v){const p=v.clone().project(camera);return new THREE.Vector2((p.x+1)/2*innerWidth,(1-p.y)/2*innerHeight);}
function segInt(p1,p2,p3,p4){const d=(p2.x-p1.x)*(p4.y-p3.y)-(p2.y-p1.y)*(p4.x-p3.x);if(Math.abs(d)<1e-6)return null;
  const t=((p3.x-p1.x)*(p4.y-p3.y)-(p3.y-p1.y)*(p4.x-p3.x))/d,u=((p3.x-p1.x)*(p2.y-p1.y)-(p3.y-p1.y)*(p2.x-p1.x))/d;return(t>=0&&t<=1&&u>=0&&u<=1)?u:null;}
addEventListener('pointerdown',e=>{initAudio();});
addEventListener('pointermove',e=>{const p=new THREE.Vector2(e.clientX,e.clientY);
  if(haveLast){const mv=p.clone().sub(last);const sp=mv.length();
    if(sp>3){for(const b of tubes){if(b.cool>0)continue;const s0=toScreen(pointAt(b,LS)),s1=toScreen(pointAt(b,LS+b.L));
      const u=segInt(last,p,s0,s1);if(u===null)continue;
      const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0).setY(0).normalize(), fwd=new THREE.Vector3();camera.getWorldDirection(fwd);fwd.y=0;fwd.normalize();
      const dw=right.multiplyScalar(mv.x).addScaledVector(fwd,-mv.y*0.5).normalize(), str=Math.min(sp/40,1.6);
      const depth=LS+b.L*Math.max(0.2,u); b.dphi.x+=dw.x*str*1.4*depth/b.lev/b.lev; b.dphi.y+=dw.z*str*1.4*depth/b.lev/b.lev;
      b.cool=0.15; chime(b,0.08+str*0.15); cur.classList.add('hold'); setTimeout(()=>cur.classList.remove('hold'),120);}}}
  last.copy(p);haveLast=true;});
swatches('sw',TINT,i=>{for(const b of tubes){b.mat.color.set(TINT[i]).lerp(new THREE.Color('#fff'),0.55);b.mat.attenuationColor.set(TINT[i]);}});
document.getElementById('wind').oninput=e=>wind=+e.target.value;
document.getElementById('gust').onclick=()=>{initAudio();gust=1;};
const scEl=document.getElementById('sc');
const clock=new THREE.Clock(); let T=0, frame=0; const G=9.8;
function step(dt){
  const w=wind*0.9+gust*1.1, wa=T*0.21, wx=Math.cos(wa)*0.8+Math.sin(T*1.7)*0.3, wz=Math.sin(wa*1.3)*0.8+Math.cos(T*1.3)*0.3;
  for(const b of bodies){const k=G/b.lev, turb=(Math.sin(T*3.1+b.pv.x*5)+Math.sin(T*4.3+b.pv.z*7))*0.5;
    const wf=w*(b.striker?3.2:0.9)*(1+turb*0.6)/b.lev;
    b.dphi.x+=(-k*b.phi.x-0.25*b.dphi.x+wf*wx)*dt; b.dphi.y+=(-k*b.phi.y-0.25*b.dphi.y+wf*wz)*dt;
    b.phi.addScaledVector(b.dphi,dt); b.cool-=dt; b.flash=Math.max(0,b.flash-dt*2.5);}
  // collisions (horizontal at contact height)
  for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const A=bodies[i],B=bodies[j];
    let yc; if(A.striker||B.striker){yc=TOPY-SL;const t=A.striker?B:A;if(TOPY-LS-t.L>yc)continue;} else yc=Math.max(TOPY-LS-A.L,TOPY-LS-B.L)+0.05;
    const hA=TOPY-yc, hB=hA;
    const ax=A.pv.x+A.phi.x*hA, az=A.pv.z+A.phi.y*hA, bx=B.pv.x+B.phi.x*hB, bz=B.pv.z+B.phi.y*hB;
    const dx=bx-ax, dz=bz-az, d=Math.hypot(dx,dz), m=A.r+B.r; if(d>=m||d<1e-5)continue;
    const nx=dx/d, nz=dz/d, vax=A.dphi.x*hA, vaz=A.dphi.y*hA, vbx=B.dphi.x*hB, vbz=B.dphi.y*hB;
    const vr=(vbx-vax)*nx+(vbz-vaz)*nz, o=(m-d)*0.5;
    A.phi.x-=nx*o/hA;A.phi.y-=nz*o/hA;B.phi.x+=nx*o/hB;B.phi.y+=nz*o/hB;
    if(vr<0){const jv=-(1.6)*vr/2;A.dphi.x-=nx*jv/hA;A.dphi.y-=nz*jv/hA;B.dphi.x+=nx*jv/hB;B.dphi.y+=nz*jv/hB;
      if(-vr>0.08){for(const t of [A,B])if(!t.striker&&t.cool<=0){chime(t,0.05+(-vr)*0.25);t.cool=0.08;}}}}
}
function loop(){
  const dt=Math.min(clock.getDelta(),1/30); T+=dt; gust=Math.max(0,gust-dt*0.55);
  for(let s=0;s<4;s++)step(dt/4);
  let k=0;
  for(const b of bodies){const d=dirOf(b);b.mesh.position.copy(b.pv);b.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),d);
    const t=b.striker?pointAt(b,SL):pointAt(b,LS);strPos.set([b.pv.x,b.pv.y,b.pv.z,t.x,t.y,t.z],k);k+=6;
    if(b.mat){b.mat.emissive.set(b.mat.attenuationColor);b.mat.emissiveIntensity=b.flash*0.35;}}
  strPos.set([0,TOPY+0.14,0,0,TOPY+0.75,0],k); strGeo.attributes.position.needsUpdate=true;
  if(frame++%10===0)scEl.textContent=struck;
  const a=Math.sin(T*0.07)*0.3;
  camera.position.set(Math.sin(a)*16,6+Math.sin(T*0.1)*0.3,Math.cos(a)*16); camera.lookAt(1.4,6.1,0);
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
window.__t={tubes,camera,get struck(){return struck},toScreen,pointAt,LS};
loop();

</script></body></html>
