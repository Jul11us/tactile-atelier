<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Run</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Helvetica Neue",Arial,sans-serif;color:#111;cursor:none;user-select:none}
canvas{display:block}
#title{position:fixed;top:34px;left:40px;pointer-events:none}
#title .lab{font-variant:small-caps;letter-spacing:.18em;font-size:13px;text-transform:lowercase;color:#555}
#title h1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:64px;line-height:.95;margin:10px 0 12px}
#title h1 span{color:#3d7bff}
#title p{margin:0;font-size:14px;color:#666}
#panel{position:fixed;right:32px;top:50%;transform:translateY(-50%);width:220px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid #eee;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:20px;font-size:12px}
#panel h4{margin:0 0 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#888;font-weight:500}
.sw{display:flex;gap:9px;margin-bottom:20px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:none;padding:0}
.sw button.on{box-shadow:0 0 0 2px #111}
.seg{display:flex;gap:6px;margin-bottom:18px}.seg button{flex:1;border:1px solid #ddd;background:#fff;border-radius:999px;padding:6px 0;font-size:11px;cursor:none}.seg button.on{background:#111;color:#fff;border-color:#111}
input[type=range]{width:100%;accent-color:#111;margin:0 0 18px;cursor:none}
.row{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #eee;padding:9px 0}
.row b{font-family:Georgia,serif;font-style:italic;font-size:22px;font-weight:400}
.act{width:100%;margin-top:12px;background:#111;color:#fff;border:0;border-radius:999px;padding:12px;font-size:13px;letter-spacing:.04em;cursor:none}
.act:hover{background:#333}
#hint{position:fixed;left:40px;bottom:30px;font-size:12px;letter-spacing:.08em;color:#777;pointer-events:none}
#cur{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1.5px solid #111;background:rgba(17,17,17,.06);pointer-events:none;transition:width .15s,height .15s,margin .15s,background .15s;z-index:9}
#cur.hold{width:12px;height:12px;margin:-6px 0 0 -6px;background:#111}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/","cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
</head><body>
<div id="title"><div class="lab">Nº 11 / Rolling Goods</div><h1>Marble /<br><span>Run.</span></h1><p>Glass marbles on a track you rebuild by hand.</p></div>
<div id="panel"><h4>Marble</h4><div class="sw" id="sw"></div>
<h4>Gravity</h4><input id="grav" type="range" min="4" max="30" step="0.5" value="14">
<div class="row"><span>Marbles</span><b id="mc">0</b></div>
<div class="row"><span>In the cup</span><b id="cc">0</b></div>
<button class="act" id="drop">Drop marbles</button></div>
<div id="hint">Drag a piece to move · Right-click or R to rotate · Scroll to raise</div>
<div id="cur"></div>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const cur=document.getElementById('cur');
addEventListener('pointermove',e=>{cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;});
function swatches(id,cols,cb){const el=document.getElementById(id);cols.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;if(!i)b.className='on';b.onclick=()=>{[...el.children].forEach((x,j)=>x.className=j===i?'on':'');cb(i);};el.appendChild(b);});}

const MCOL=['#ff4d5e','#ffa21f','#2fbf71','#3d7bff','#9a5bff'];
let mcol=0, inCup=0;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#fff');
const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,0.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0xeeeeee,0.5));
const sun=new THREE.DirectionalLight(0xffffff,1.5); sun.position.set(5,16,8); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:50}); sun.shadow.radius=5; sun.shadow.bias=-0.0006; scene.add(sun);
const floorMesh=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.ShadowMaterial({opacity:0.12})); floorMesh.rotation.x=-Math.PI/2; floorMesh.receiveShadow=true; scene.add(floorMesh);

// physics
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-14,0)}); world.broadphase=new CANNON.SAPBroadphase(world); world.solver.iterations=10;
const trackM=new CANNON.Material('track'), marbleM=new CANNON.Material('marble');
world.addContactMaterial(new CANNON.ContactMaterial(trackM,marbleM,{friction:0.04,restitution:0.25}));
world.addContactMaterial(new CANNON.ContactMaterial(marbleM,marbleM,{friction:0.05,restitution:0.45}));
const ground=new CANNON.Body({mass:0,shape:new CANNON.Plane(),material:trackM}); ground.quaternion.setFromEuler(-Math.PI/2,0,0); world.addBody(ground);

// ---- piece definitions: list of boxes in local frame {h:[hx,hy,hz], p:[x,y,z], e:[x,y,z] (YXZ euler)}
const T=0.1;
function rampParts(){const L=4,drop=0.8,a=Math.atan2(drop,L),c=[2,-0.4,0];const P=[];
  P.push({h:[2.05,T,0.6],p:c,e:[0,0,-a]});
  for(const z of[-0.68,0.68])P.push({h:[2.05,0.28,0.08],p:[2,-0.2,z],e:[0,0,-a]});
  P.push({h:[0.08,0.2,0.76],p:[-0.08,0.25,0],e:[0,0,0]}); return P;}
function curveParts(){const R=2,N=9,drop=1.0,P=[];
  for(let i=0;i<N;i++){const f=(i+0.5)/N*Math.PI/2, y=-drop*(i+0.5)/N, sl=Math.atan2(drop,R*Math.PI/2);
    const rad=[Math.sin(f),0,Math.cos(f)], ctr=[0,0,-R];
    const at=(r,dy)=>[ctr[0]+rad[0]*r,y+dy,ctr[2]+rad[2]*r];
    P.push({h:[R*Math.PI/4/N*1.25,T,0.62],p:at(R,-T),e:[0,f,-sl]});
    P.push({h:[(R+0.7)*Math.PI/4/N*1.25,0.35,0.08],p:at(R+0.7,0.2),e:[0,f,-sl]});
    P.push({h:[(R-0.7)*Math.PI/4/N*1.3,0.3,0.08],p:at(R-0.7,0.15),e:[0,f,-sl]});}
  return P;}
function funnelParts(){const N=16,ri=0.72,ro=1.9,h=1.7,rm=(ri+ro)/2,t=Math.atan2(h,ro-ri),L=Math.hypot(h,ro-ri),P=[];
  for(let i=0;i<N;i++){const a=i/N*Math.PI*2;P.push({h:[L/2,0.06,Math.PI*rm/N*1.3],p:[Math.cos(a)*rm,h/2,-Math.sin(a)*rm],e:[0,a,t]});}
  return P;}
function cupParts(){const N=14,r=0.95,P=[];for(let i=0;i<N;i++){const a=i/N*Math.PI*2;P.push({h:[0.07,0.45,Math.PI*r/N*1.2],p:[Math.cos(a)*r,0.45,-Math.sin(a)*r],e:[0,a,0]});}
  P.push({h:[0.1,1.6,1.2],p:[1.15,1.6,0],e:[0,0,0]}); return P;}
const DEFS={ramp:{parts:rampParts,col:'#f2ede4'},curve:{parts:curveParts,col:'#ece8f7'},funnel:{parts:funnelParts,col:'#e6f2ec'},
  bumper:{parts:()=>[],col:'#ff6b5a'},cup:{parts:cupParts,col:'#f4f1ea'}};
const pieces=[], pickMeshes=[];
function makePiece(type,pos,k){
  const def=DEFS[type], g=new THREE.Group(), mat=new THREE.MeshStandardMaterial({color:def.col,roughness:0.55});
  const body=new CANNON.Body({mass:0,material:trackM});
  for(const pr of def.parts()){
    const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(...pr.e,'YXZ'));
    body.addShape(new CANNON.Box(new CANNON.Vec3(...pr.h)),new CANNON.Vec3(...pr.p),new CANNON.Quaternion(q.x,q.y,q.z,q.w));
    if(type!=='funnel'&&!(type==='cup'&&pr.h[1]<1)){const m=new THREE.Mesh(new RoundedBoxGeometry(pr.h[0]*2,pr.h[1]*2,pr.h[2]*2,2,Math.min(0.05,pr.h[1]*0.9,pr.h[0]*0.9)),mat);
      m.position.set(...pr.p);m.quaternion.copy(q);m.castShadow=m.receiveShadow=true;g.add(m);}
  }
  if(type==='funnel'){const pts=[new THREE.Vector2(0.72,0),new THREE.Vector2(1.9,1.7),new THREE.Vector2(2.0,1.78)];
    const m=new THREE.Mesh(new THREE.LatheGeometry(pts,40),new THREE.MeshStandardMaterial({color:def.col,roughness:0.5,side:THREE.DoubleSide}));m.castShadow=m.receiveShadow=true;g.add(m);}
  if(type==='cup'){const pts=[new THREE.Vector2(0,0.02),new THREE.Vector2(0.95,0.02),new THREE.Vector2(1.02,0.9),new THREE.Vector2(1.1,0.95)];
    const m=new THREE.Mesh(new THREE.LatheGeometry(pts,40),new THREE.MeshStandardMaterial({color:'#222',roughness:0.4,side:THREE.DoubleSide}));m.castShadow=m.receiveShadow=true;g.add(m);}
  if(type==='bumper'){body.addShape(new CANNON.Cylinder(0.5,0.5,0.9,16),new CANNON.Vec3(0,0.45,0));
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.55,0.9,32),mat);m.position.y=0.45;m.castShadow=true;g.add(m);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.52,0.06,10,40),new THREE.MeshStandardMaterial({color:'#fff',emissive:'#ff6b5a',emissiveIntensity:0}));ring.rotation.x=Math.PI/2;ring.position.y=0.9;g.add(ring);g.userData.ring=ring;
    body.addEventListener('collide',e=>{const o=e.body;if(!o.isMarble)return;const d=new CANNON.Vec3(o.position.x-body.position.x,0,o.position.z-body.position.z);d.normalize();o.velocity.x+=d.x*5;o.velocity.z+=d.z*5;o.velocity.y+=1.5;pc.flash=1;});}
  scene.add(g); world.addBody(body);
  const pc={type,g,body,pos:new THREE.Vector3(...pos),k,flash:0};
  g.traverse(o=>{if(o.isMesh){o.userData.piece=pc;pickMeshes.push(o);}});
  placePiece(pc); pieces.push(pc); return pc;
}
function placePiece(pc){const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,pc.k*Math.PI/2,0));
  pc.g.position.copy(pc.pos); pc.g.quaternion.copy(q); pc.body.position.set(pc.pos.x,pc.pos.y,pc.pos.z); pc.body.quaternion.set(q.x,q.y,q.z,q.w);
  pc.body.aabbNeedsUpdate=true; pc.body.updateBoundingRadius(); pc.body.updateAABB();}
// pre-built run
const FUN=[-6,6.6,0];
makePiece('funnel',FUN,0);
makePiece('ramp',[-6.5,5.6,0],0);
makePiece('curve',[-2.7,4.6,0],0);
makePiece('ramp',[-0.7,3.1,-1.5],1);
const CUP=[-0.7,0,-7.6]; const cupPc=makePiece('cup',CUP,1);
makePiece('bumper',[3.5,0,2.5],0);
makePiece('ramp',[3,0.9,0],2);

// marbles
const swirl=MCOL.map(c=>{const cv=document.createElement('canvas');cv.width=128;cv.height=64;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,128,64);
  for(let i=0;i<5;i++){x.strokeStyle=i%2?c:'#ffffff';x.lineWidth=10;x.beginPath();for(let u=0;u<=128;u+=4)x.lineTo(u,32+Math.sin(u/128*Math.PI*4+i*1.3)*22);x.stroke();}
  x.fillStyle=c;x.globalAlpha=.5;x.fillRect(0,0,128,64);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t;});
const R=0.28, glassGeo=new THREE.SphereGeometry(R,32,20), coreGeo=new THREE.SphereGeometry(R*0.62,24,16);
const glassMat=new THREE.MeshPhysicalMaterial({color:'#fff',roughness:0,transmission:1,thickness:0.5,ior:1.5,clearcoat:1,envMapIntensity:1.4});
const coreMats=MCOL.map((c,i)=>new THREE.MeshStandardMaterial({map:swirl[i],roughness:0.3,emissive:c,emissiveIntensity:0.15}));
const marbles=[];
let actx=null, lastClack=0;
function clack(v){if(!actx)return;const now=actx.currentTime;if(now-lastClack<0.03)return;lastClack=now;
  const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=2400+Math.random()*1200;
  g.gain.setValueAtTime(Math.min(0.12,v*0.02),now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.06);o.connect(g).connect(actx.destination);o.start(now);o.stop(now+0.07);}
function addMarble(p,v){
  const m=new THREE.Mesh(glassGeo,glassMat); const core=new THREE.Mesh(coreGeo,coreMats[mcol]); m.add(core); m.castShadow=true; scene.add(m);
  const body=new CANNON.Body({mass:0.2,shape:new CANNON.Sphere(R),material:marbleM,linearDamping:0.02,angularDamping:0.05});
  body.isMarble=true; body.position.copy(p); if(v)body.velocity.copy(v); world.addBody(body);
  body.addEventListener('collide',e=>{const iv=Math.abs(e.contact.getImpactVelocityAlongNormal());if(iv>1.2)clack(iv);});
  marbles.push({m,body}); if(marbles.length>40)removeMarble(marbles[0]);
}
function removeMarble(mb){scene.remove(mb.m);world.removeBody(mb.body);marbles.splice(marbles.indexOf(mb),1);}
let queue=[];
function dropMarbles(n){for(let i=0;i<n;i++)queue.push({t:i*0.45,c:mcol});}
dropMarbles(4);
// input
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let drag=null;
function setMouse(e){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);}
addEventListener('pointermove',e=>setMouse(e));
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
renderer.domElement.addEventListener('pointerdown',e=>{
  if(!actx)try{actx=new AudioContext();}catch(_){}
  setMouse(e); ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(pickMeshes,false)[0]; if(!h)return;
  const pc=h.object.userData.piece;
  if(e.button===2){pc.k=(pc.k+1)%4;placePiece(pc);return;}
  const p=planeHit(pc.pos.y); drag={pc,off:pc.pos.clone().sub(p)}; cur.classList.add('hold');
});
addEventListener('pointerup',()=>{drag=null;cur.classList.remove('hold');});
addEventListener('keydown',e=>{if(drag&&(e.key==='r'||e.key==='R')){drag.pc.k=(drag.pc.k+1)%4;placePiece(drag.pc);}});
addEventListener('wheel',e=>{if(!drag)return;drag.pc.pos.y=Math.max(0,drag.pc.pos.y+(e.deltaY<0?0.5:-0.5));placePiece(drag.pc);},{passive:true});
function planeHit(y){ray.setFromCamera(mouse,camera);const p=new THREE.Vector3();ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-y),p);return p;}
swatches('sw',MCOL,i=>mcol=i);
document.getElementById('grav').oninput=e=>world.gravity.set(0,-(+e.target.value),0);
document.getElementById('drop').onclick=()=>{if(!actx)try{actx=new AudioContext();}catch(_){} dropMarbles(6);};
const mcEl=document.getElementById('mc'), ccEl=document.getElementById('cc');
const clock=new THREE.Clock(); let Tm=0, frame=0;
function loop(){
  const dt=Math.min(clock.getDelta(),1/30); Tm+=dt;
  for(const q of queue)q.t-=dt;
  queue=queue.filter(q=>{if(q.t>0)return true;const a=Math.random()*Math.PI*2,r=0.9,c=mcol;mcol=q.c;
    addMarble(new CANNON.Vec3(FUN[0]+Math.cos(a)*r,FUN[1]+2.0,FUN[2]-Math.sin(a)*r),new CANNON.Vec3(-Math.sin(a)*1.2,0,-Math.cos(a)*1.2));mcol=c;return false;});
  if(drag){const p=planeHit(drag.pc.pos.y).add(drag.off);drag.pc.pos.x=Math.round(p.x*2)/2;drag.pc.pos.z=Math.round(p.z*2)/2;placePiece(drag.pc);}
  world.step(1/120,dt,8);
  inCup=0;
  for(const mb of [...marbles]){const p=mb.body.position;
    if(p.y<-3||Math.abs(p.x)>40||Math.abs(p.z)>40){removeMarble(mb);continue;}
    if(Math.hypot(p.x-cupPc.pos.x,p.z-cupPc.pos.z)<0.95&&p.y<cupPc.pos.y+1)inCup++;
    mb.m.position.copy(p);mb.m.quaternion.copy(mb.body.quaternion);}
  for(const pc of pieces)if(pc.g.userData.ring){pc.flash=Math.max(0,pc.flash-dt*3);pc.g.userData.ring.material.emissiveIntensity=pc.flash*2;pc.g.scale.setScalar(1+pc.flash*0.08);}
  if(frame++%10===0){mcEl.textContent=marbles.length;ccEl.textContent=inCup;}
  const a=0.75+Math.sin(Tm*0.07)*0.18;
  camera.position.set(-1+Math.sin(a)*24,12+Math.sin(Tm*0.1)*0.5,-2+Math.cos(a)*24); camera.lookAt(-3.2,4.2,-2.5);
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
window.__t={marbles,pieces,camera,sim(s){for(let i=0;i<s*120;i++)world.step(1/120);},spawn(){const a=Math.random()*6.28;addMarble(new CANNON.Vec3(FUN[0]+Math.cos(a)*0.9,FUN[1]+2,FUN[2]-Math.sin(a)*0.9),new CANNON.Vec3(-Math.sin(a)*1.2,0,-Math.cos(a)*1.2));},get inCup(){return inCup}};
loop();

</script></body></html>
