<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clay Stamp</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Helvetica Neue",Arial,sans-serif;color:#111;cursor:none;user-select:none}
canvas{display:block}
#title{position:fixed;top:34px;left:40px;pointer-events:none}
#title .lab{font-variant:small-caps;letter-spacing:.18em;font-size:13px;text-transform:lowercase;color:#555}
#title h1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:64px;line-height:.95;margin:10px 0 12px}
#title h1 span{color:#d9825b}
#title p{margin:0;font-size:14px;color:#666}
#panel{position:fixed;right:32px;top:50%;transform:translateY(-50%);width:220px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid #eee;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:20px;font-size:12px}
#panel h4{margin:0 0 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#888;font-weight:500}
.sw{display:flex;gap:9px;margin-bottom:20px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:none;padding:0}
.sw button.on{box-shadow:0 0 0 2px #111}
.seg{display:flex;gap:6px;margin-bottom:18px}.seg button{flex:1;border:1px solid #ddd;background:#fff;border-radius:999px;padding:6px 0;font-size:11px;cursor:none}.seg button.on{background:#111;color:#fff;border-color:#111}
input[type=range]{width:100%;accent-color:#111;margin:0 0 18px;cursor:none}
.row{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #eee;padding:9px 0}
.row b{font-family:Georgia,serif;font-style:italic;font-size:22px;font-weight:400}
.act{width:100%;margin-top:12px;background:#111;color:#fff;border:0;border-radius:999px;padding:12px;font-size:13px;letter-spacing:.04em;cursor:none}
.act:hover{background:#333}
#hint{position:fixed;left:40px;bottom:30px;font-size:12px;letter-spacing:.08em;color:#777;pointer-events:none}
#cur{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1.5px solid #111;background:rgba(17,17,17,.06);pointer-events:none;transition:width .15s,height .15s,margin .15s,background .15s;z-index:9}
#cur.hold{width:12px;height:12px;margin:-6px 0 0 -6px;background:#111}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="title"><div class="lab">Nº 12 / Pressed Goods</div><h1>Clay /<br><span>Stamp.</span></h1><p>A soft slab that remembers every press — for a while.</p></div>
<div id="panel"><h4>Clay</h4><div class="sw" id="sw"></div>
<h4>Stamp</h4><div class="seg" id="seg"></div>
<h4>Softness</h4><input id="soft" type="range" min="0" max="1" step="0.01" value="0.5">
<div class="row"><span>Stamps</span><b id="sc">0</b></div>
<div class="row"><span>Deepest</span><b id="dp">0mm</b></div>
<button class="act" id="smooth">Smooth it out</button></div>
<div id="hint">Click to stamp · Drag to draw · Shift-drag to smear</div>
<div id="cur"></div>
<script type="module">
import * as THREE from 'three';
const cur=document.getElementById('cur');
addEventListener('pointermove',e=>{cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;});
function swatches(id,cols,cb){const el=document.getElementById(id);cols.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;if(!i)b.className='on';b.onclick=()=>{[...el.children].forEach((x,j)=>x.className=j===i?'on':'');cb(i);};el.appendChild(b);});}

const CCOL=['#d9825b','#e8a5a0','#9fb89a','#e0b860','#8fa6c9'];
const SHAPES=['circle','star','heart','finger'];
let shape=0, soft=0.5, stamps=0;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#fff');
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,0.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0xd8d2cc,1.0));
const sun=new THREE.DirectionalLight(0xfff6ec,2.2); sun.position.set(-7,8,4); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:30}); sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.03; sun.shadow.radius=3; scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,0.5); fill.position.set(6,5,-3); scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:0.12})); floor.rotation.x=-Math.PI/2; floor.position.y=-0.9; floor.receiveShadow=true; scene.add(floor);
// slab
const W=10, D=7.5, NX=160, NZ=120;
const geo=new THREE.PlaneGeometry(W,D,NX,NZ).rotateX(-Math.PI/2);
const pos=geo.attributes.position, NV=pos.count;
const base=new Float32Array(NV), h=new Float32Array(NV), tmp=new Float32Array(NV), edge=new Float32Array(NV);
for(let i=0;i<NV;i++){const x=pos.getX(i),z=pos.getZ(i);
  const ex=W/2-Math.abs(x), ez=D/2-Math.abs(z), e=Math.min(ex,ez), B=0.5;
  let y=0; if(e<B){const t=1-e/B; y=-(1-Math.sqrt(Math.max(0,1-t*t)))*0.55;}
  y+=0.012*Math.sin(x*2.3+z*1.7)*Math.sin(z*2.9-x*0.7)+0.006*Math.sin(x*9.1)*Math.cos(z*8.3);
  base[i]=y; edge[i]=THREE.MathUtils.smoothstep(e,0.15,0.7);}
const mat=new THREE.MeshPhysicalMaterial({color:CCOL[0],roughness:0.88,metalness:0,sheen:0.6,sheenRoughness:0.8,sheenColor:new THREE.Color('#ffffff')});
const slab=new THREE.Mesh(geo,mat); slab.castShadow=slab.receiveShadow=true; scene.add(slab);
const sides=new THREE.Mesh(new THREE.BoxGeometry(W-0.02,0.42,D-0.02),mat); sides.position.y=-0.9+0.21; sides.castShadow=true; scene.add(sides);
function idx(c,r){return r*(NX+1)+c;}
const dx=W/NX, dz=D/NZ;
function writeGeo(){for(let i=0;i<NV;i++)pos.setY(i,base[i]+h[i]*edge[i]);pos.needsUpdate=true;geo.computeVertexNormals();}
writeGeo();
// stamp masks: u,v in stamp radius units
function mask(s,u,v){const r=Math.hypot(u,v);
  if(s===0){return (1-THREE.MathUtils.smoothstep(r,0.82,1.0))*(0.88+0.12*(1-r*r));}
  if(s===1){const th=Math.atan2(v,u);const f=(Math.cos(5*th)+1)/2;const R=0.45+0.55*Math.pow(f,1.6);return 1-THREE.MathUtils.smoothstep(r,R-0.12,R);}
  if(s===2){const x=u*1.25,y=v*1.25+0.25;const F=Math.pow(x*x+y*y-1,3)-x*x*y*y*y;return 1-THREE.MathUtils.smoothstep(F,-0.06,0.04);}
  const e=Math.hypot(u/0.62,v/0.88);return Math.sqrt(Math.max(0,1-e*e));}
const RS=0.85;
function stampAt(x,z,s,amount){
  const ext=RS*1.5; const c0=Math.max(0,Math.floor((x-ext+W/2)/dx)),c1=Math.min(NX,Math.ceil((x+ext+W/2)/dx));
  const r0=Math.max(0,Math.floor((z-ext+D/2)/dz)),r1=Math.min(NZ,Math.ceil((z+ext+D/2)/dz));
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const i=idx(c,r);const u=(c*dx-W/2-x)/RS, v=(-(r*dz-D/2)+z)/RS*-1;
    const m=mask(s,u,v), rim=Math.max(0,mask(s,u/1.45,v/1.45)-m);
    h[i]+=amount*(-m+0.5*rim); if(h[i]<-0.7)h[i]=-0.7;}
}
function smear(x,z,mx,mz){
  const R=0.9, len=Math.hypot(mx,mz); if(len<1e-4)return; tmp.set(h);
  const c0=Math.max(1,Math.floor((x-R*1.6+W/2)/dx)),c1=Math.min(NX-1,Math.ceil((x+R*1.6+W/2)/dx));
  const r0=Math.max(1,Math.floor((z-R*1.6+D/2)/dz)),r1=Math.min(NZ-1,Math.ceil((z+R*1.6+D/2)/dz));
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const px=c*dx-W/2,pz=r*dz-D/2;const d=Math.hypot(px-x,pz-z)/R;
    const w=Math.max(0,1-d*d);
    // advect from behind
    const sx=(px-mx*w*1.2+W/2)/dx, sz=(pz-mz*w*1.2+D/2)/dz; const ci=Math.max(0,Math.min(NX-1,Math.floor(sx))), ri=Math.max(0,Math.min(NZ-1,Math.floor(sz)));
    const fx=sx-ci, fz=sz-ri; const sv=tmp[idx(ci,ri)]*(1-fx)*(1-fz)+tmp[idx(ci+1,ri)]*fx*(1-fz)+tmp[idx(ci,ri+1)]*(1-fx)*fz+tmp[idx(ci+1,ri+1)]*fx*fz;
    let nv=sv - w*len*0.12; const front=((px-x)*mx+(pz-z)*mz)/(len*R); const ring=Math.max(0,1-Math.abs(d-1.05)*3);
    if(front>0)nv+=ring*front*len*0.35;
    h[idx(c,r)]=Math.max(-0.7,Math.min(0.5,nv));}
}
// presets
stampAt(-2.4,-0.6,0,0.22); stampAt(0.2,0.8,1,0.22); stampAt(2.6,-0.9,2,0.2);
// outline preview
function outline(s){const pts=[];for(let k=0;k<=72;k++){const th=k/72*Math.PI*2;let lo=0,hi=1.6;
  for(let it=0;it<16;it++){const mid=(lo+hi)/2;if(mask(s,Math.cos(th)*mid,Math.sin(th)*mid)>0.5)lo=mid;else hi=mid;}
  pts.push(new THREE.Vector3(Math.cos(th)*lo*RS,0,-Math.sin(th)*lo*RS));}return new THREE.BufferGeometry().setFromPoints(pts);}
const ghost=new THREE.Line(outline(0),new THREE.LineBasicMaterial({color:'#111',transparent:true,opacity:0.45})); scene.add(ghost);
// input
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let down=null, smoothing=0, dirty=true;
function setMouse(e){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);}
function hit(){ray.setFromCamera(mouse,camera);const p=new THREE.Vector3();return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),p)?p:null;}
const inside=p=>p&&Math.abs(p.x)<W/2-0.2&&Math.abs(p.z)<D/2-0.2;
addEventListener('pointermove',e=>setMouse(e));
renderer.domElement.addEventListener('pointerdown',e=>{setMouse(e);const p=hit();if(!inside(p))return;
  down={shift:e.shiftKey,last:p.clone(),press:{x:p.x,z:p.z,t:0}}; if(!e.shiftKey){stamps++;} cur.classList.add('hold');});
addEventListener('pointerup',()=>{down=null;cur.classList.remove('hold');});
swatches('sw',CCOL,i=>{mat.color.set(CCOL[i]);});
const seg=document.getElementById('seg');
SHAPES.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;if(!i)b.className='on';b.onclick=()=>{shape=i;[...seg.children].forEach((x,j)=>x.className=j===i?'on':'');ghost.geometry.dispose();ghost.geometry=outline(i);};seg.appendChild(b);});
document.getElementById('soft').oninput=e=>soft=+e.target.value;
document.getElementById('smooth').onclick=()=>smoothing=1.2;
const scEl=document.getElementById('sc'), dpEl=document.getElementById('dp');
const clock=new THREE.Clock(); let T=0, frame=0;
function loop(){
  const dt=Math.min(clock.getDelta(),1/30); T+=dt;
  const p=hit();
  if(down&&p){
    if(down.shift||window.__shift){const mx=p.x-down.last.x,mz=p.z-down.last.z; if(Math.hypot(mx,mz)>0.02){smear(p.x,p.z,mx,mz);down.last.copy(p);dirty=true;}}
    else{ if(down.press){const pr=down.press,dur=0.16;const a=Math.min(dt,dur-pr.t);if(a>0){stampAt(pr.x,pr.z,shape,(0.16+0.22*soft)*(pr.k||1)*a/dur);pr.t+=a;dirty=true;}}
      if(inside(p)&&Math.hypot(p.x-down.last.x,p.z-down.last.z)>RS*0.2){down.press={x:p.x,z:p.z,t:0,k:0.3};down.last.copy(p);} }
  }
  // relax: slow return + gentle diffusion
  const rate=(0.01+soft*0.06)*dt, k=Math.min(0.2,soft*0.5*dt*10);
  if(smoothing>0){smoothing-=dt;const f=Math.exp(-5*dt);for(let i=0;i<NV;i++)h[i]*=f;dirty=true;}
  if(frame%2===0){let any=false;tmp.set(h);
    for(let r=1;r<NZ;r++)for(let c=1;c<NX;c++){const i=idx(c,r);const v=tmp[i];if(v===0&&tmp[i+1]===0&&tmp[i-1]===0)continue;any=true;
      const lap=tmp[i+1]+tmp[i-1]+tmp[i+NX+1]+tmp[i-NX-1]-4*v;let nv=(v+k*lap*0.25)*(1-rate*2);if(Math.abs(nv)<1e-5)nv=0;h[i]=nv;}
    if(any)dirty=true;}
  if(dirty){writeGeo();dirty=false;}
  if(p&&inside(p)){ghost.visible=!(down&&(down.shift||window.__shift));ghost.position.set(p.x,0.06,p.z);}else ghost.visible=false;
  if(frame++%10===0){scEl.textContent=stamps;let mn=0;for(let i=0;i<NV;i++)if(h[i]<mn)mn=h[i];dpEl.textContent=Math.round(-mn*100)+'mm';}
  const a=Math.sin(T*0.07)*0.18;
  camera.position.set(Math.sin(a)*13,11+Math.sin(T*0.1)*0.3,Math.cos(a)*13); camera.lookAt(1.2,-0.9,0.2);
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
window.__t={get stamps(){return stamps},camera,h};
loop();

</script></body></html>
